[package]
name = "teletype-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

# Detached from the parent workspace (same shape `cargo fuzz init`
# generates): the parent builds stable-only targets (Tauri, whisper.cpp)
# that must never be pulled into an instrumented nightly build.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
teletype-core = { path = "../crates/teletype-core" }
teletype-inference = { path = "../crates/teletype-inference" }
teletype-speech = { path = "../crates/teletype-speech" }
serde_json = "1"

[[bin]]
name = "itn_normalize"
path = "fuzz_targets/itn_normalize.rs"

[[bin]]
name = "sse_parser"
path = "fuzz_targets/sse_parser.rs"

[[bin]]
name = "storage_load"
path = "fuzz_targets/storage_load.rs"

[[bin]]
name = "diff_ops"
path = "fuzz_targets/diff_ops.rs"

[[bin]]
name = "hotwords_file"
path = "fuzz_targets/hotwords_file.rs"
