# cargo-deny policy (plan §9.4).
#
# Run: `cargo deny check licenses bans` (CI: the license-check job).
# `cargo deny check` (all checks) is run locally / nightly.
#
# Rationale for each section lives in the comments next to it.

[graph]
# Skip dev-dependencies for license/ban checks? No: a dev dependency that
# pulls in a GPL crate still taints the tree, so we check everything.
# (cargo-deny >=0.16 schema: the old `all-targets`/`completions` keys were
# removed; the defaults already check all targets and include dev-deps, so no
# replacement key is needed here.)

[licenses]
# The app ships these licenses in THIRD_PARTY_NOTICES (kept in sync by
# scripts/check-notices.sh), so the allow list is the notices file's list.
# Add a license here only after the notices check already passes with it.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "MPL-2.0",
    # Permissive licenses found in the tree by `cargo deny check` (2026-10-16):
    # Boost (clipboard-win, error-code), 0BSD (enum-iterator*; also on the
    # plan's npx license-checker allow list), Unlicense (public domain),
    # CDLA-Permissive-2.0 (data license).
    "BSL-1.0",
    "0BSD",
    "Unlicense",
    "CDLA-Permissive-2.0",
]

# Everything not in `allow` is denied by default, which is how copyleft
# (GPL/AGPL/LGPL) stays out: cargo-deny >=0.16 removed the old
# `copyleft = "deny"` shortcut (EmbarkStudios/cargo-deny#611); the exhaustive
# allow-list plus the explicit `*gpl*` ban below carry that policy now.

[bans]
# GPL is banned even though `copyleft = "deny"` already catches it: the ban
# names the family explicitly so a future "why does this fail" reader does
# not have to know what `copyleft` means.
deny = [
    { name = "*gpl*" },
]
multiple-versions = "warn"

[sources]
# GitHub/git dependencies are a supply-chain surface: an unpinned fork can
# move under us between builds. The workspace currently has no git
# dependencies, so this list is intentionally empty (tight). If a pinned
# fork becomes genuinely necessary, add it here with a comment naming the
# reason and the exact rev.
allow-git = []
