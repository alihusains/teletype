[package]
name = "teletype-desktop"
description = "Teletype desktop app (Tauri 2)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "teletype_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "teletype"
path = "src/main.rs"

[features]
default = ["neudecide"]
# Exposes `tauri::test::mock_app()` so the dictation controller's
# concurrency tests can build a Session without a real Tauri app.
test = ["tauri/test", "teletype-core/test-support"]
# NeuDecide decider in command mode (Addendum A). Default ON as of
# 2026-10-18 (A.5 flip: parity 92% ≥ 90%, suite +24.9 ≥ +20, latency
# p95 87.5 ms under the user-approved 200 ms budget). Pulls the ONNX
# runtime into the decider; when the model files are absent at runtime
# the take-level selection falls through to Needle (A.3.3 wiring).
neudecide = ["teletype-decider/onnx"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
teletype-decider = { path = "../teletype-decider" }
teletype-core = { path = "../teletype-core", features = ["test-support"] }
teletype-speech = { path = "../teletype-speech" }
teletype-fluid = { path = "../teletype-fluid" }
teletype-inference = { path = "../teletype-inference" }
silero-vad-pure = { version = "0.1.1", default-features = false }
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api", "devtools"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2.5"
tauri-plugin-dialog = "2"
# In-app updates. Tauri 2 has this built in, so it is cross-platform and reuses
# the existing app shell rather than adding a second update framework.
tauri-plugin-updater = "2"
# Required by the updater to relaunch the app after installing an update.
tauri-plugin-process = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
cpal = { workspace = true }
arboard = { workspace = true }
enigo = { workspace = true }
uuid = { workspace = true }
dirs = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking", "json"] }
# Parses the user-supplied provider base URL. Hand-rolled splitting on
# `:` and `/` mistook URL userinfo for the host (see read_api_key).
url = "2"
# Streams the SHA-256 of a downloaded model file without holding it in memory.
sha2 = "0.10"
keyring = "4"
# Pure-Rust audio decoder for file transcription (P3.17): wav/mp3/flac/ogg/aac.
symphonia = "0.5"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", features = ["catch-all"] }
objc2-foundation = { version = "0.3", features = ["NSString"] }
core-foundation = "0.10"
# Pre-generated Accessibility bindings for the direct-write injection tier.
# The AX headers ship only in the full Xcode SDK; these compile against the
# Command Line Tools SDK, which is what CI and a fresh checkout use.
objc2-application-services = { version = "0.3", default-features = false, features = [
    "AXError",
    "AXUIElement",
    "AXValue",
    "AXValueConstants",
    "HIServices",
    "objc2-foundation",
] }
objc2-core-foundation = { version = "0.3", features = ["CFString"] }
# CoreAudio transport-type detection for smart mic selection (plan §5.2).
# Already in the workspace dependency tree via cpal; used on macOS only for
# kAudioDevicePropertyTransportType.
coreaudio-rs = "0.14"
objc2-core-audio = "0.3"

[target.'cfg(target_os = "windows")'.dependencies.windows]
version = "0.61"
features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Threading",
  "Win32_System_ProcessStatus",
  "Win32_System_LibraryLoader",
  # P8.5: UIA property reads return `VARIANT` (Win32_Sub-Variant); the
  # `GetCurrentPropertyValue` family is cfg-gated on Com+Ole+Variant and the
  # Variant helpers (VariantToBoolean/VariantToInt32/VariantToStringAlloc) on
  # Com+Ole. Verified against the 0.61.3 source cfg attributes.
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_System_Variant",
  # P8.5: UIA readers (focused control text, selection, caret context).
  # In windows-rs 0.61 the UIA COM API lives in `Win32::UI::Accessibility`
  # (there is no `Win32::UI::Automation` module); verified against
  # windows-0.61.3/src/Windows/Win32/UI/Accessibility/mod.rs and gated by
  # the `Win32_UI_Accessibility` feature (windows-0.61.3/Cargo.toml:703).
  "Win32_UI_Accessibility",
  # P8.5: start/stop dictation cues via PlaySoundW. In 0.61 PlaySoundW and
  # the SND_* flags live in `Win32::Media::Audio` (verified against
  # windows-0.61.3/src/Windows/Win32/Media/Audio/mod.rs), not in
  # `Win32::System::Diagnostics::Debug`.
  "Win32_Media_Audio",
]

[lints]
workspace = true

# tempfile is used by integration tests (tests/file_transcribe.rs) for
# isolated per-test scratch dirs. Added by P0.3 tooling (no product change).
[dev-dependencies]
tempfile = "3"
proptest = "1"
