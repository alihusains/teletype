[package]
name = "teletype-speech"
description = "Local speech-to-text providers for Teletype"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"

# whisper-rs is macOS-only for now: whisper-rs-sys cannot be built for the
# Windows target from a non-Windows host (bindgen + C toolchain need MSVC).
# The native Windows build (W2/W3) re-enables it and drops the stub provider.
[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# sherpa-onnx ships prebuilt ONNX Runtime libraries per platform (statically
# linked via sherpa-onnx-sys), so it builds on any host without a C toolchain.
# In CI, cache the prebuilts with SHERPA_ONNX_ARCHIVE_DIR (plan §3.3).
sherpa-onnx = "1.13"
# needle-sys is the FFI binding for the Cactus runtime 4.0.0 C API (the
# renamed Needle 3 engine). The Whistle provider (optional "Tiny" engine,
# plan §3.5) loads `whistle.cact` into the engine's speech slot via
# `needle_sys::load_model`. needle-sys downloads a prebuilt `libcactus.a` and
# `cactus.h` via its build script, so no C toolchain is needed. On Windows
# the upstream prebuilt is a MinGW/libc++ archive, so needle-sys compiles a
# stub and Whistle reports unavailable. Coexists with teletype-inference's
# use of needle-sys (different model slot: NEEDLE_SPEECH vs NEEDLE_TEXT).
needle-sys = { path = "../needle-sys" }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
parakeet-sys = { path = "../parakeet-sys" }
parakeet-cpp-sys = { path = "../parakeet-cpp-sys" }
whisper-rs = { version = "0.16", features = ["metal", "coreml"] }
# transcribe.cpp (handy-computer, MIT) is the runtime for the
# Engine::TranscribeCpp rows (Nemotron 3.5 ASR streaming, Moonshine
# streaming, Granite Speech 5.0 TurboCTC). Its `transcribe-cpp-sys`
# dependency builds the native library from the vendored source via
# CMake, so a first build here needs a C++ toolchain and CMake. The
# default `metal` feature is on. Upstream also exposes `vulkan`, but
# this tree does not enable it and no Windows build is measured, so no
# Windows path is claimed here.
transcribe-cpp = "0.4"

[lints]
workspace = true
