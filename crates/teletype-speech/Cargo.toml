[package]
name = "teletype-speech"
description = "Local speech-to-text providers for Teletype"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"

# The Cactus Needle static engine (Whistle STT + Needle tool-calling) is an
# OPTIONAL, non-default feature. The runtime archive
# (`third_party/needle/macos-arm64/libneedle.a`) is a local, untracked artifact
# with no verified license/provenance in this repository, so the default build
# (CI, release, clean checkout) does not link it and the Whistle engine is
# reported unavailable. Enable `cactus` only on a machine that has the archive
# placed locally (see docs/whistle-integration.md, "Asset provenance").
# `build.rs` fails the build with an actionable message when the feature is on
# but the archive is missing, so a build can never silently pass without it.
[features]
default = []
cactus = []

# whisper-rs is macOS-only for now: whisper-rs-sys cannot be built for the
# Windows target from a non-Windows host (bindgen + C toolchain need MSVC).
# The native Windows build (W2/W3) re-enables it and drops the stub provider.
[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
parakeet-sys = { path = "../parakeet-sys" }
whisper-rs = { version = "0.16", features = ["metal", "coreml"] }

[lints]
workspace = true
