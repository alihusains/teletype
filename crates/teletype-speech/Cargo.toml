[package]
name = "teletype-speech"
description = "Local speech-to-text providers for Teletype"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"

# Link the Cactus static engine (Whistle STT +, later, Needle tool-calling).
# The vendored runtime (`third_party/needle/macos-arm64/libneedle.a`) is
# committed, so this is on by default on the platforms it supports. The FFI in
# `whistle.rs` links it via build.rs; the model (`whistle.cact`) is downloaded
# on demand like the other speech models.
[features]
default = ["cactus"]
cactus = []

# whisper-rs is macOS-only for now: whisper-rs-sys cannot be built for the
# Windows target from a non-Windows host (bindgen + C toolchain need MSVC).
# The native Windows build (W2/W3) re-enables it and drops the stub provider.
[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
parakeet-sys = { path = "../parakeet-sys" }
whisper-rs = { version = "0.16", features = ["metal", "coreml"] }

[lints]
workspace = true
