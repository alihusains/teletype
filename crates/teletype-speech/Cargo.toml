[package]
name = "teletype-speech"
description = "Local speech-to-text providers for Teletype"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"

# Link the Cactus static engine (Whistle STT +, later, Needle tool-calling).
# Off by default: the native `libcactus_engine.a` must be built/vendored first
# (see docs/whistle-integration.md). Enabling it activates the real FFI in
# `whistle.rs`; without it the provider degrades to "runtime not bundled".
[features]
default = []
cactus = []

# whisper-rs is macOS-only for now: whisper-rs-sys cannot be built for the
# Windows target from a non-Windows host (bindgen + C toolchain need MSVC).
# The native Windows build (W2/W3) re-enables it and drops the stub provider.
[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
parakeet-sys = { path = "../parakeet-sys" }
whisper-rs = { version = "0.16", features = ["metal", "coreml"] }

[lints]
workspace = true
