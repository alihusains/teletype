[package]
name = "needle-sys"
description = "FFI bindings for the Cactus runtime C API (Needle 3 engine)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"

# Declaring `links` makes cargo set DEP_NEEDLE_SYS_ROOT for downstream
# build-dependents so they can locate the static library. The key `needle`
# is a stable package identity, not the archive name, so it is unchanged by
# the move to `libcactus.a`.
links = "needle"

[dependencies]
thiserror = { workspace = true }

[build-dependencies]
ureq = "2"

[lints]
workspace = true
