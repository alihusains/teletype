[package]
name = "teletype-core"
description = "Platform-independent core of Teletype: pipeline, AutoText, transforms, personalization, context, state machine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
arc-swap = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
cpal = { workspace = true }
arboard = { workspace = true }
enigo = { workspace = true }
uuid = { workspace = true }
regex = { workspace = true }
rusqlite = { workspace = true }
silero-vad-pure = { workspace = true }
nnnoiseless = { workspace = true }
rphonetic = "4"
strsim = "0.11"
aho-corasick = "1"
rubato = "0.15"
ringbuf = "0.5"
toml = "0.8"
similar = "3.2.0"
ort = { workspace = true }
ndarray = "0.16"


[lints]
workspace = true

[features]
test-support = []

[dev-dependencies]
criterion = "0.5"
proptest = "1"
insta = "1"
tempfile = "3"

# Criterion benches need `harness = false`; without it cargo runs them under
# the libtest harness, which rejects the `--save-baseline` the CI bench step
# passes ("Unrecognized option: 'save-baseline'") and the criterion `main`
# from `criterion_main!` never takes over.
[[bench]]
name = "audio"
harness = false

[[bench]]
name = "itn"
harness = false

[[bench]]
name = "pipeline"
harness = false

