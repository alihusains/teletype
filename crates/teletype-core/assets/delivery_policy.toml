# Per-app delivery policy for the injection cascade (P8.1).
#
# `mode` selects how dictated text lands in the app:
#   "paste_verify" — clipboard + paste shortcut, then verify the text
#                    appeared in the focused field.
#
#                    Verification: the field is polled for the pasted text
#                    within a short window, then re-polled once for a grace
#                    window (the AX `value` attribute can lag the actual
#                    paste on a loaded machine). The outcome depends on
#                    what the read-back shows:
#
#                    - Text seen: PastedVerified.
#                    - Field unreadable, or text too short to verify by
#                      containment: the paste most likely landed, so the
#                      outcome is PastedUnverified (quiet, clipboard
#                      restored as usual).
#                    - Field readable and verifiable, but the text is still
#                      absent after the grace window: the paste may not
#                      have landed. The outcome is ClipboardOnly: the text
#                      stays on the clipboard as a kept write and the user
#                      is told to press the paste shortcut.
#
#                    In no case does the cascade fall back to typing after
#                    a paste whose landing is unknown: a second copy would
#                    double the text if the paste had already landed. The
#                    default.
#   "type"         — type character-by-character; no clipboard use.
#   "setvalue"     — write the field value directly via accessibility.
#
# Apps are matched by EXACT bundle id (macOS) or process name (Windows);
# anything without a rule gets [default].
#
# Secure fields (passwords, OTP) are ALWAYS refused, regardless of policy:
# dictation never lands in a secure input.
#
# Accessibility trust is checked live on every delivery, before any mode
# runs. Without the grant the paste shortcut cannot be sent, so the text is
# left on the clipboard and the message names the cause, regardless of the
# mode chosen here.

[default]
mode = "paste_verify"

# Terminals paste-verify can read back poorly and where the paste key
# behaves differently; typing is the reliable route.
["com.apple.Terminal"]
mode = "type"

["com.googlecode.iterm2"]
mode = "type"

# Word resists keyboard simulation of long runs; paste + verify works.
["com.microsoft.Word"]
mode = "paste_verify"

# VS Code: paste + verify; its editor exposes the focused value.
["com.microsoft.VSCode"]
mode = "paste_verify"

# Terax (app.crynta.terax): its text field inconsistently exposes its AX
# value, so paste-verify's read-back is flaky. F-19 removed the typed
# fallback from the paste_verify path, so an inconclusive verification now
# stops with the text on the clipboard rather than re-typing on top of a
# paste that already landed. Pure typed delivery (no clipboard, no
# verify-fallback race) is still the reliable route here.
["app.crynta.terax"]
mode = "type"
