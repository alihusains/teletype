# Per-app delivery policy for the injection cascade (P8.1).
#
# `mode` selects how dictated text lands in the app:
#   "paste_verify" — clipboard + paste shortcut, then verify the text
#                    appeared in the focused field.
#
#                    Verification: the field is polled for the pasted text
#                    within a short window, then re-polled once for a grace
#                    window (the AX `value` attribute can lag the actual
#                    paste on a loaded machine). The outcome depends on
#                    what the read-back shows:
#
#                    - Text seen: PastedVerified.
#                    - Field unreadable, or text too short to verify by
#                      containment: the paste most likely landed, so the
#                      outcome is PastedUnverified (quiet, clipboard
#                      restored as usual).
#                    - Field readable and verifiable, but the text is still
#                      absent after the grace window: the paste may not
#                      have landed. The outcome is ClipboardOnly: the text
#                      stays on the clipboard as a kept write and the user
#                      is told to press the paste shortcut.
#
#                    In no case does the cascade fall back to typing after
#                    a paste whose landing is unknown: a second copy would
#                    double the text if the paste had already landed. The
#                    default.
#   "type"         — type character-by-character; no clipboard use.
#   "setvalue"     — write the field value directly via accessibility.
#
# Apps are matched by EXACT bundle id (macOS) or process name (Windows);
# anything without a rule gets [default].
#
# Secure fields (passwords, OTP) are ALWAYS refused, regardless of policy:
# dictation never lands in a secure input.
#
# Accessibility trust is checked live on every delivery, before any mode
# runs. Without the grant the paste shortcut cannot be sent, so the text is
# left on the clipboard and the message names the cause, regardless of the
# mode chosen here.

[default]
mode = "paste_verify"

# Terminals: paste, don't type.
#
# The old route was "type" (character-by-character) because a terminal's AX
# value reads back poorly for paste-verify. But typing a synthetic
# character stream into a terminal is the unreliability: a key-down held a
# fraction too long (or a lost key-up) makes the terminal echo the last
# character repeatedly, mangling dictation into "aaaaa".
#
# The reference product (Wispr Flow) and its open-source competitor
# (EnviousWispr) both paste into terminals: put the text on the clipboard and
# fire one ⌘V, with a short hold between the key-down and key-up so the
# chord reads as a normal human keypress. A terminal accepts a single paste
# cleanly and never sees a key stream, so the mangling cannot happen.
#
# paste_verify is the right mode here even though the terminal's field is
# often unreadable: the ⌘V fires, the text lands, and the unreadable read-back
# resolves to PastedUnverified (quiet, no pill, clipboard restored as usual)
# rather than a second copy. The cascade never falls back to typing after a
# paste whose landing is unknown (F-19), so there is no double-delivery.
#
# Multi-line dictation into a terminal is still refused upstream
# (refuse_newline_in_terminal) because a newline submits the line; single-line
# text — the common case — is what this route carries.
["com.apple.Terminal"]
mode = "paste_verify"

["com.googlecode.iterm2"]
mode = "paste_verify"

# Word resists keyboard simulation of long runs; paste + verify works.
["com.microsoft.Word"]
mode = "paste_verify"

# VS Code: paste + verify; its editor exposes the focused value.
["com.microsoft.VSCode"]
mode = "paste_verify"

# Terax (app.crynta.terax): same rule as the other terminals. Its text field
# inconsistently exposes its AX value, so the read-back is flaky and resolves
# to PastedUnverified (quiet, no second copy). The typed route mangles
# single-line dictation into repeated characters ("aaaa"), so Terax must
# paste like every other terminal, never type.
["app.crynta.terax"]
mode = "paste_verify"
