<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teletype</title>
  <style>
    :root {
      --bg: #f5f6f8;
      --surface: #ffffff;
      --surface-hover: #eef1f6;
      --surface-2: #f4f6f9;
      --border: #e6e9ef;
      --text: #141821;
      --text-secondary: #6b7280;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --accent-soft: #eaf1fe;
      --danger: #ef4444;
      --success: #16a34a;
      --radius: 12px;
      --radius-sm: 8px;

      /* Compatibility aliases used by the post-v0.2.6 pill and the Settings
         screen, which are kept as-is. Values map onto the v0.2.6 palette so
         they do not reintroduce the later token world. */
      --accent-strong: #2563eb;
      --accent-strong-hover: #1d4ed8;
      --accent-ink: #1d4ed8;
      --on-accent: #ffffff;
      --danger-soft: #fef3f2;
      --success-soft: #e9fbf0;
      --violet: #7c3aed;
      --pink: #ec4899;
      --scrim: rgba(16, 20, 32, 0.45);
      --radius-xs: 6px;
      --radius-pill: 999px;
      --tracking-display: -0.025em;

      /* Tertiary text and the hairline that separates stacked rows. Both are
         used to build hierarchy without adding another weight of grey; before
         these existed, "secondary" had to carry three different levels and
         the result was cards that all looked equally important. */
      --text-tertiary: #9aa1ad;
      --border-subtle: #eef0f4;
      /* Amber, distinct from --danger red. A model that needs downloading is
         not an error, and colouring it red made a routine first-run step look
         like something had broken. */
      --warning: #b45309;
      --warning-soft: #fef4e6;

      /* Elevation. Three steps only. Elevation is a claim about how far a
         surface is from the page, so more levels than this stops meaning
         anything; each step is a hairline plus a shadow that reads as ambient
         rather than a drop. */
      --shadow-1: 0 1px 2px rgba(16, 20, 32, 0.05);
      --shadow-2: 0 1px 2px rgba(16, 20, 32, 0.05), 0 4px 12px rgba(16, 20, 32, 0.06);
      --shadow-3: 0 2px 4px rgba(16, 20, 32, 0.06), 0 12px 32px rgba(16, 20, 32, 0.1);
      --ring: 0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent);

      /* Type scale. Display sizes are set in the components; these are the
         sizes used often enough to be worth naming. The whole scale sits one
         step above where it was: at 14px body the app read as a dense settings
         panel, and the reference products at the same window size are clearly
         one notch larger and airier. */
      --text-xs: 12px;
      --text-sm: 13.5px;
      --text-md: 15px;
      --text-lg: 20px;
      --text-xl: 26px;
      --text-2xl: 28px;
      /* Optical correction: at small sizes a touch of tracking keeps dense
         label rows from reading as a solid block of text. */
      --tracking-tight: -0.2px;

      /* Duration tokens. Only transforms and opacity animate on the dictation
         path, both compositor-only, so a longer duration here cannot cost
         frame time. */
      --ease: cubic-bezier(0.2, 0, 0.13, 1);
      --dur-fast: 120ms;
      --dur: 180ms;
    }
    /* Dark palette. Applied when the app forces dark (data-theme="dark") or
       when the OS prefers dark and the app setting is not pinned to light.
       A forced light (data-theme="light") never matches either selector, so
       it always wins over an OS dark preference. */
    :root[data-theme="dark"] {
      --bg: #101014;
      --surface: #1a1a22;
      --surface-hover: #22222c;
      --surface-2: #16161c;
      --border: #2a2a34;
      --text: #ececf1;
      --text-secondary: #9a9aa8;
      --accent: #4f8ef7;
      --accent-hover: #6ba0f9;
      --accent-soft: #1c2740;
      --danger: #f87171;
      --success: #4ade80;
      --text-tertiary: #6f6f80;
      --border-subtle: #23232d;
      --warning: #fbbf24;
      --warning-soft: #2a2213;
      /* Compatibility aliases (see the light palette note above). */
      --accent-strong: #4f8ef7;
      --accent-strong-hover: #6ba0f9;
      --accent-ink: #9cc2fb;
      --on-accent: #0b1020;
      --danger-soft: rgba(248, 113, 113, 0.12);
      --success-soft: rgba(74, 222, 128, 0.12);
      --violet: #b98aff;
      --pink: #f6a6a6;
      --scrim: rgba(0, 0, 0, 0.65);
      /* Shadows are near-invisible on a dark surface, so the elevation cue
         moves to the border. A dark UI that relies on drop shadows alone
         looks like a flat sheet with slightly different greys. */
      --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.3);
      --shadow-2: 0 1px 3px rgba(0, 0, 0, 0.36);
      --shadow-3: 0 8px 28px rgba(0, 0, 0, 0.5);
      --ring: 0 0 0 3px color-mix(in srgb, var(--accent) 42%, transparent);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #101014;
        --surface: #1a1a22;
        --surface-hover: #22222c;
        --surface-2: #16161c;
        --border: #2a2a34;
        --text: #ececf1;
        --text-secondary: #9a9aa8;
        --accent: #4f8ef7;
        --accent-hover: #6ba0f9;
        --accent-soft: #1c2740;
        --danger: #f87171;
        --success: #4ade80;
        --text-tertiary: #6f6f80;
        --border-subtle: #23232d;
        --warning: #fbbf24;
        --warning-soft: #2a2213;
        /* Compatibility aliases (see the light palette note above). */
        --accent-strong: #4f8ef7;
        --accent-strong-hover: #6ba0f9;
        --accent-ink: #9cc2fb;
        --on-accent: #0b1020;
        --danger-soft: rgba(248, 113, 113, 0.12);
        --success-soft: rgba(74, 222, 128, 0.12);
        --violet: #b98aff;
        --pink: #f6a6a6;
        --scrim: rgba(0, 0, 0, 0.65);
        --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.3);
        --shadow-2: 0 1px 3px rgba(0, 0, 0, 0.36);
        --shadow-3: 0 8px 28px rgba(0, 0, 0, 0.5);
        --ring: 0 0 0 3px color-mix(in srgb, var(--accent) 42%, transparent);
      }
    }
    /* Reduce Motion: the app setting (data-motion="reduced") forces it; when
       the setting is off (not "full") the OS preference still applies. */
    :root[data-motion="reduced"] *,
    :root[data-motion="reduced"] *::before,
    :root[data-motion="reduced"] *::after {
      animation-duration: 0.001s !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001s !important;
    }
    @media (prefers-reduced-motion: reduce) {
      :root:not([data-motion="full"]) *,
      :root:not([data-motion="full"]) *::before,
      :root:not([data-motion="full"]) *::after {
        animation-duration: 0.001s !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001s !important;
      }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: var(--text-md);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    button {
      font-family: inherit;
      font-size: inherit;
      cursor: pointer;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 6px 12px;
      background: var(--surface);
      color: var(--text);
      transition: background 0.15s, border-color 0.15s;
    }
    button:hover { background: var(--surface-hover); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button.primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    button.primary:hover { background: var(--accent-hover); }
    button.danger { color: var(--danger); }
    /* Keyboard focus needs to be obvious and needs to not appear on mouse
       click. `:focus-visible` is what separates the two; a plain `:focus` ring
       is the single most common reason a polished app feels unfinished. */
    :focus-visible {
      outline: none;
      box-shadow: var(--ring);
      border-radius: var(--radius-sm);
    }
    input, select, textarea {
      font-family: inherit;
      font-size: inherit;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 10px;
      outline: none;
      transition: border-color var(--dur-fast) var(--ease),
        box-shadow var(--dur-fast) var(--ease);
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--accent);
      box-shadow: var(--ring);
    }
    /* Placeholder text at full --text-secondary competes with real values for
       attention, which matters most in a field the user must read back. */
    input::placeholder, textarea::placeholder { color: var(--text-tertiary); }

    /* ---- Surfaces ---- */
    /* One card definition. Screens had been rolling their own inline borders,
       so the same content sat at three different visual weights depending on
       which screen it was on. */
    .tt-card {
      background: var(--surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius);
      box-shadow: var(--shadow-1);
    }
    /* Hover is transform-only, so it runs on the compositor and never
       triggers layout. */
    .tt-card-interactive {
      transition: box-shadow var(--dur) var(--ease),
        transform var(--dur) var(--ease),
        border-color var(--dur) var(--ease);
    }
    .tt-card-interactive:hover {
      box-shadow: var(--shadow-2);
      border-color: var(--border);
      transform: translateY(-1px);
    }
    /* Uppercase micro-label. Establishes the eyebrow / value hierarchy that
       flat label-value rows were missing. */
    .tt-eyebrow {
      font-size: var(--text-xs);
      font-weight: 600;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--text-tertiary);
    }

    /* ---- Buttons ---- */
    .tt-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-weight: 500;
      transition: background var(--dur-fast) var(--ease),
        border-color var(--dur-fast) var(--ease),
        opacity var(--dur-fast) var(--ease);
    }
    .tt-btn-primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .tt-btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
    .tt-btn-ghost { background: transparent; border-color: transparent; color: var(--text-secondary); }
    .tt-btn-ghost:hover { background: var(--surface-hover); color: var(--text); }
    .tt-btn-sm { padding: 4px 10px; font-size: var(--text-sm); border-radius: 6px; }

    /* ---- Section heading ---- */
    .tt-section-title {
      font-size: var(--text-lg);
      font-weight: 650;
      letter-spacing: var(--tracking-tight);
      margin-bottom: 2px;
    }
    .tt-section-sub {
      font-size: var(--text-sm);
      color: var(--text-secondary);
    }
    /* ---- Screen heading ----
       Every screen used to hard-code its own title size (18, 20, 22 and 26 all
       appear), so switching tabs resized the heading. One class, one size. */
    .tt-screen-title {
      font-size: var(--text-2xl);
      font-weight: 650;
      letter-spacing: var(--tracking-display);
      color: var(--text);
      margin: 0;
    }
    .tt-screen-sub {
      font-size: var(--text-md);
      color: var(--text-secondary);
      margin-top: 5px;
    }
    /* HotkeyRecorder keycap: pulsing accent glow while capturing. */
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 6px color-mix(in srgb, var(--accent) 18%, transparent); }
      50% { box-shadow: 0 0 14px color-mix(in srgb, var(--accent) 38%, transparent); }
    }
    /* Blinking cursor bar next to "Press keys…" while capturing. */
    @keyframes cursorBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    /* A hairline, always-reserved scrollbar for the nav rail. Defining
       ::-webkit-scrollbar at all makes WebKit use a classic (non-overlay)
       gutter instead of the macOS one that fades out, so the affordance is
       there when the list overflows instead of the last row simply ending.
       `scrollbar-width: thin` must NOT be set here: as soon as it is, Chrome
       and Safari switch to the standard overlay scrollbar and ignore every
       ::-webkit-scrollbar rule below, which is the opposite of the intent. */
    .tt-scroll-thin {
      overflow-y: auto;
    }
    .tt-scroll-thin::-webkit-scrollbar { width: 5px; }
    .tt-scroll-thin::-webkit-scrollbar-track { background: transparent; }
    .tt-scroll-thin::-webkit-scrollbar-thumb {
      background: color-mix(in srgb, var(--text-tertiary) 55%, transparent);
      border-radius: 3px;
    }
    .tt-scroll-thin::-webkit-scrollbar-thumb:hover { background: var(--text-tertiary); }

    /* ---- Post-v0.2.6 compatibility ----
       The Settings screen and the pill work are kept from the newer tree and
       still carry these class names; the v0.2.6 sheet predates them. Render
       them with v0.2.6 geometry so they do not reintroduce the later world. */
    .tt-page { max-width: 1200px; margin: 0; }
    .tt-page-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 22px;
    }
    .tt-page-title {
      font-size: var(--text-xl);
      font-weight: 650;
      letter-spacing: var(--tracking-display);
      color: var(--text);
    }
    .tt-page-sub {
      font-size: var(--text-sm);
      color: var(--text-secondary);
      margin-top: 3px;
    }
    .tt-pill-stage {
      min-height: 124px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 12px;
      border-radius: var(--radius-sm);
    }
    .tt-pill-stage[data-preview-theme="light"] {
      --bg: #ffffff;
      --surface: #ffffff;
      --surface-2: #f5f5f5;
      --surface-hover: #f1f1f1;
      --border: #cdcdcd;
      --border-subtle: #ebebeb;
      --text: #000000;
      --text-secondary: #5c5c5c;
      --text-tertiary: #a0a0a0;
      --accent: #11a8ff;
      --accent-hover: #0b96e6;
      --accent-strong: #0678b8;
      --accent-strong-hover: #05679e;
      --accent-soft: #e9f7ff;
      --accent-ink: #0678b8;
      --on-accent: #ffffff;
      --danger: #d92d20;
      --danger-soft: #fef3f2;
      --success: #01ca45;
      --success-soft: #e9fbf0;
      --warning: #b7791f;
      --warning-soft: #fbefaf;
      background: #eef1f5;
    }
    .tt-pill-stage[data-preview-theme="dark"] {
      --bg: #0b0b0d;
      --surface: #141416;
      --surface-2: #101012;
      --surface-hover: #1d1d21;
      --border: #2e2e33;
      --border-subtle: #232327;
      --text: #f4f4f5;
      --text-secondary: #a1a1aa;
      --text-tertiary: #8b8b95;
      --accent: #38b6ff;
      --accent-hover: #5cc4ff;
      --accent-strong: #38b6ff;
      --accent-strong-hover: #5cc4ff;
      --accent-soft: rgba(56, 182, 255, 0.14);
      --accent-ink: #8fd4ff;
      --on-accent: #04121a;
      --danger: #ff6b6b;
      --danger-soft: rgba(255, 107, 107, 0.12);
      --success: #35d06a;
      --success-soft: rgba(53, 208, 106, 0.12);
      --warning: #fbbf24;
      --warning-soft: rgba(251, 191, 36, 0.12);
      background: #070708;
    }
    @keyframes tt-ping {
      0% { transform: scale(1); opacity: 0.35; }
      75%, 100% { transform: scale(2.2); opacity: 0; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
