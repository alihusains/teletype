<!DOCTYPE html>
<html lang="en" data-brand="purple">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teletype</title>
  <style>
    /* Brand faces. Open Runde is the display/heading face (Letters' geometric
       humanist with tight display tracking); Inter is the body and UI face.
       Both are bundled locally so the app never reaches the network for type. */
    @font-face {
      font-family: "Open Runde";
      src: url("/fonts/OpenRunde-Regular.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: "Open Runde";
      src: url("/fonts/OpenRunde-Medium.woff2") format("woff2");
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: "Open Runde";
      src: url("/fonts/OpenRunde-Semibold.woff2") format("woff2");
      font-weight: 600;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: "Open Runde";
      src: url("/fonts/OpenRunde-Bold.woff2") format("woff2");
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: "Inter";
      src: url("/fonts/InterVariable.woff2") format("woff2");
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }

    /* ------------------------------------------------------------------
       Letters design system — paper-white canvas, near-black type, one
       chromatic accent, pill actions, 18px cards, atmospheric shadows.
       Teletype keeps its purple as the single accent (the brand colour used
       by the app icon), taking the place Letters gives its surgical blue.
       Filled actions stay monochrome obsidian, exactly as Letters specifies.
       ------------------------------------------------------------------ */
    :root {
      /* Letters core palette */
      --color-obsidian: #070709;
      --color-paper-white: #ffffff;
      --color-cloud-gray: #f5f5f5;
      --color-sky-tint: #d7e6f5;
      --color-charcoal: #60606c;
      --color-slate: #8b8b8b;
      --color-ink: #151515;
      --color-surgical-blue: #2597d0;

      /* Teletype brand accent — the purple carried over from the current
         design and the app icon. Used only for functional punctuation, never
         as a large filled surface or a CTA background. */
      --color-brand: #702fd2;

      --bg: #ffffff;
      --surface: #ffffff;
      --surface-hover: #f5f5f5;
      --surface-2: #f5f5f5;
      --border: #e6e7eb;
      --border-subtle: #eff0f3;
      --border-strong: #bebecc;
      --text: #070709;
      --text-secondary: #60606c;
      --text-tertiary: #8b8b8b;
      --text-inverse: #ffffff;

      /* Functional accent (purple brand). */
      --accent: #702fd2;
      --accent-hover: #5d24b5;
      --accent-soft: #f3edfd;
      --accent-ink: #5b21b6;

      /* Filled action. Letters is intentionally monochrome for actions: a
         chromatic CTA background is never used. */
      --action: #070709;
      --action-hover: #26262c;
      --on-action: #ffffff;

      /* Compatibility aliases still referenced by older surfaces. */
      --accent-strong: #702fd2;
      --accent-strong-hover: #5d24b5;
      --on-accent: #ffffff;
      --danger: #d92d20;
      --danger-soft: #fef3f2;
      --success: #16a34a;
      --success-soft: #edfaf1;
      --violet: #702fd2;
      --pink: #ec4899;
      --scrim: rgba(7, 7, 9, 0.45);
      --warning: #b45309;
      --warning-soft: #fdf6ec;

      /* Shape. Full rounding is the signature: buttons, tags and nav pills
         are all 100px; cards are 18px; inputs are 12px. */
      --radius: 18px;
      --radius-sm: 12px;
      --radius-xs: 8px;
      --radius-pill: 100px;
      --radius-large: 28px;

      /* Type. Open Runde for display/headings, Inter for everything else. */
      --font-display: "Open Runde", "Inter", ui-sans-serif, system-ui, -apple-system,
        BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-body: "Inter", ui-sans-serif, system-ui, -apple-system,
        BlinkMacSystemFont, "Segoe UI", sans-serif;

      /* Type scale — the Letters sizes, tuned for a desktop app. */
      --text-xs: 12px;
      --text-sm: 14px;
      --text-md: 15px;
      --text-lg: 20px;
      --text-xl: 26px;
      --text-2xl: 28px;
      --tracking-display: -0.04em;
      --tracking-tight: -0.01em;
      --leading-body: 1.49;

      /* Atmospheric, blue-tinted elevation. Kept very low-opacity so cards
         float instead of casting a corporate drop shadow. */
      --shadow-1: rgba(16, 55, 132, 0.05) 0px 1px 2px 0px;
      --shadow-2: rgba(16, 55, 132, 0.04) 0px 1px 2px 0px,
        rgba(16, 55, 132, 0.04) 0px 10px 30px 0px;
      --shadow-3: rgba(16, 55, 132, 0.03) 0px 17px 37px 0px,
        rgba(16, 55, 132, 0.03) 0px 67px 67px 0px,
        rgba(16, 55, 132, 0.02) 0px 150px 90px 0px;
      --ring: 0 0 0 3px color-mix(in srgb, var(--accent) 28%, transparent);

      /* The sky band is the one atmospheric colour moment in the product.
         It appears in the Home hero and first-run only, never below them. */
      --sky-gradient: linear-gradient(180deg, #779bc1 0%, #9abfda 58%, #cbdcec 100%);

      /* Motion. Only transforms and opacity animate on the dictation path. */
      --ease: cubic-bezier(0.2, 0, 0.13, 1);
      --dur-fast: 120ms;
      --dur: 180ms;
    }

    /* Dark palette. Teletype still supports an OS/forced dark appearance;
       this is a faithful inversion of the Letters light world, retaining the
       purple accent (lightened for contrast) and the same shape language. */
    :root[data-theme="dark"] {
      --bg: #0b0b0f;
      --surface: #14141a;
      --surface-hover: #1d1d24;
      --surface-2: #101016;
      --border: #2a2a33;
      --border-subtle: #212129;
      --border-strong: #3a3a46;
      --text: #f4f4f5;
      --text-secondary: #a4a4b0;
      --text-tertiary: #8b8b95;
      --accent: #b69cff;
      --accent-hover: #c9b4ff;
      --accent-soft: #2a2140;
      --accent-ink: #d3c4ff;
      --action: #f5f5f7;
      --action-hover: #e7e7ec;
      --on-action: #070709;
      --accent-strong: #b69cff;
      --accent-strong-hover: #c9b4ff;
      --on-accent: #0b0b0f;
      --danger: #f87171;
      --danger-soft: rgba(248, 113, 113, 0.12);
      --success: #4ade80;
      --success-soft: rgba(74, 222, 128, 0.12);
      --violet: #b69cff;
      --pink: #f6a6a6;
      --scrim: rgba(0, 0, 0, 0.65);
      --warning: #fbbf24;
      --warning-soft: #2a2213;
      --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.32);
      --shadow-2: 0 1px 3px rgba(0, 0, 0, 0.36);
      --shadow-3: 0 8px 28px rgba(0, 0, 0, 0.5);
      --ring: 0 0 0 3px color-mix(in srgb, var(--accent) 40%, transparent);
      --sky-gradient: linear-gradient(180deg, #24364a 0%, #182432 58%, #10151d 100%);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0b0b0f;
        --surface: #14141a;
        --surface-hover: #1d1d24;
        --surface-2: #101016;
        --border: #2a2a33;
        --border-subtle: #212129;
        --border-strong: #3a3a46;
        --text: #f4f4f5;
        --text-secondary: #a4a4b0;
        --text-tertiary: #8b8b95;
        --accent: #b69cff;
        --accent-hover: #c9b4ff;
        --accent-soft: #2a2140;
        --accent-ink: #d3c4ff;
        --action: #f5f5f7;
        --action-hover: #e7e7ec;
        --on-action: #070709;
        --accent-strong: #b69cff;
        --accent-strong-hover: #c9b4ff;
        --on-accent: #0b0b0f;
        --danger: #f87171;
        --danger-soft: rgba(248, 113, 113, 0.12);
        --success: #4ade80;
        --success-soft: rgba(74, 222, 128, 0.12);
        --violet: #b69cff;
        --pink: #f6a6a6;
        --scrim: rgba(0, 0, 0, 0.65);
        --warning: #fbbf24;
        --warning-soft: #2a2213;
        --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.32);
        --shadow-2: 0 1px 3px rgba(0, 0, 0, 0.36);
        --shadow-3: 0 8px 28px rgba(0, 0, 0, 0.5);
        --ring: 0 0 0 3px color-mix(in srgb, var(--accent) 40%, transparent);
        --sky-gradient: linear-gradient(180deg, #24364a 0%, #182432 58%, #10151d 100%);
      }
    }
    /* The light tile is the shipped default, so the brand block sits before
       the dark palette and is overridden there. */
    :root[data-brand="purple"] {
      --accent: #702fd2;
      --accent-hover: #5d24b5;
      --accent-soft: #f3edfd;
      --accent-strong: #702fd2;
      --accent-strong-hover: #5d24b5;
      --accent-ink: #5b21b6;
    }
    :root[data-theme="dark"][data-brand="purple"] {
      --accent: #b69cff;
      --accent-hover: #c9b4ff;
      --accent-soft: #2a2140;
      --accent-strong: #b69cff;
      --accent-strong-hover: #c9b4ff;
      --accent-ink: #d3c4ff;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"])[data-brand="purple"] {
        --accent: #b69cff;
        --accent-hover: #c9b4ff;
        --accent-soft: #2a2140;
        --accent-strong: #b69cff;
        --accent-strong-hover: #c9b4ff;
        --accent-ink: #d3c4ff;
      }
    }

    /* Reduce Motion: the app setting (data-motion="reduced") forces it; when
       the setting is off (not "full") the OS preference still applies. */
    :root[data-motion="reduced"] *,
    :root[data-motion="reduced"] *::before,
    :root[data-motion="reduced"] *::after {
      animation-duration: 0.001s !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001s !important;
    }
    @media (prefers-reduced-motion: reduce) {
      :root:not([data-motion="full"]) *,
      :root:not([data-motion="full"]) *::before,
      :root:not([data-motion="full"]) *::after {
        animation-duration: 0.001s !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001s !important;
      }
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #root { height: 100%; }
    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text);
      font-size: var(--text-md);
      line-height: var(--leading-body);
      letter-spacing: var(--tracking-tight);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    h1, h2, h3, h4, h5, h6 {
      font-family: var(--font-display);
      font-weight: 600;
      letter-spacing: var(--tracking-display);
      line-height: 1.15;
    }
    ::selection { background: var(--accent-soft); color: var(--accent-ink); }

    /* ---- Buttons ----
       Full-round pills at every size. The filled action is obsidian; purple
       is reserved for state and micro-graphics, never a button fill. */
    button {
      font-family: var(--font-body);
      font-size: var(--text-sm);
      font-weight: 500;
      cursor: pointer;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-pill);
      padding: 6px 14px;
      background: var(--surface);
      color: var(--text);
      line-height: 1.35;
      transition: background var(--dur-fast) var(--ease),
        border-color var(--dur-fast) var(--ease),
        box-shadow var(--dur-fast) var(--ease),
        opacity var(--dur-fast) var(--ease);
    }
    button:hover { background: var(--surface-hover); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    button.primary {
      background: var(--action);
      color: var(--on-action);
      border-color: var(--action);
      box-shadow: rgba(36, 36, 40, 0.1) 0px 1px 2px 0px,
        rgba(36, 36, 40, 0.09) 0px 3px 3px 0px,
        rgba(36, 36, 40, 0.05) 0px 6px 4px 0px,
        rgba(36, 36, 40, 0.01) 0px 11px 4px 0px;
    }
    button.primary:hover { background: var(--action-hover); border-color: var(--action-hover); }
    button.danger { color: var(--danger); }
    :focus-visible {
      outline: none;
      box-shadow: var(--ring);
    }
    input, select, textarea {
      font-family: var(--font-body);
      font-size: var(--text-sm);
      background: var(--surface);
      border: 1px solid var(--border-strong);
      color: var(--text);
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      outline: none;
      letter-spacing: var(--tracking-tight);
      transition: border-color var(--dur-fast) var(--ease),
        box-shadow var(--dur-fast) var(--ease);
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--accent);
      box-shadow: var(--ring);
    }
    input::placeholder, textarea::placeholder { color: var(--text-tertiary); }

    /* ---- Surfaces ---- */
    .tt-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-1);
    }
    .tt-card-interactive {
      transition: box-shadow var(--dur) var(--ease),
        transform var(--dur) var(--ease),
        border-color var(--dur) var(--ease);
    }
    .tt-card-interactive:hover {
      box-shadow: var(--shadow-2);
      border-color: var(--border);
      transform: translateY(-1px);
    }
    /* Uppercase micro-label, Inter at caption size. */
    .tt-eyebrow {
      font-family: var(--font-body);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: var(--text-tertiary);
    }

    /* ---- Buttons (app utilities) ---- */
    .tt-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-weight: 500;
      transition: background var(--dur-fast) var(--ease),
        border-color var(--dur-fast) var(--ease),
        opacity var(--dur-fast) var(--ease);
    }
    .tt-btn-primary {
      background: var(--action);
      color: var(--on-action);
      border-color: var(--action);
      box-shadow: rgba(36, 36, 40, 0.1) 0px 1px 2px 0px,
        rgba(36, 36, 40, 0.09) 0px 3px 3px 0px,
        rgba(36, 36, 40, 0.05) 0px 6px 4px 0px,
        rgba(36, 36, 40, 0.01) 0px 11px 4px 0px;
    }
    .tt-btn-primary:hover {
      background: var(--action-hover);
      border-color: var(--action-hover);
    }
    .tt-btn-ghost {
      background: transparent;
      border-color: var(--border-subtle);
      color: var(--text-secondary);
    }
    .tt-btn-ghost:hover { background: var(--surface-2); color: var(--text); }
    .tt-btn-sm { padding: 5px 12px; font-size: var(--text-xs); border-radius: var(--radius-pill); }

    /* ---- Headings ---- */
    .tt-section-title {
      font-family: var(--font-display);
      font-size: var(--text-lg);
      font-weight: 600;
      letter-spacing: -0.03em;
      line-height: 1.25;
      margin-bottom: 2px;
    }
    .tt-section-sub {
      font-size: var(--text-sm);
      color: var(--text-secondary);
    }
    /* One heading size for every screen, in the display face. */
    .tt-screen-title {
      font-family: var(--font-display);
      font-size: var(--text-2xl);
      font-weight: 600;
      letter-spacing: var(--tracking-display);
      line-height: 1.12;
      color: var(--text);
      margin: 0;
    }
    .tt-screen-sub {
      font-size: var(--text-md);
      color: var(--text-secondary);
      margin-top: 6px;
      line-height: var(--leading-body);
    }

    /* ---- Navigation ---- */
    .tt-nav-item {
      background: transparent;
      border: none;
      color: var(--text-secondary);
    }
    .tt-nav-item:hover { background: var(--surface-2); color: var(--text); }
    .tt-nav-item[aria-current="page"] {
      background: var(--accent-soft);
      color: var(--accent);
    }

    /* ---- Home hero ----
       The sky gradient is the single atmospheric band in the product: a
       full-bleed wash at the top of Home, then white for everything else.
       It never repeats below the hero. */
    .tt-hero {
      position: relative;
      overflow: hidden;
      border-radius: var(--radius-large);
      background: var(--sky-gradient);
      color: #ffffff;
      padding: 40px 42px;
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(240px, 0.85fr);
      gap: 30px;
      align-items: center;
      box-shadow: var(--shadow-3);
    }
    .tt-hero::after {
      content: "";
      position: absolute;
      inset: -40% -10% auto auto;
      width: 60%;
      height: 160%;
      background: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.34), transparent 62%);
      pointer-events: none;
    }
    .tt-hero-copy { position: relative; z-index: 1; min-width: 0; }
    .tt-hero-eyebrow {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.72);
    }
    .tt-hero-title {
      font-family: var(--font-display);
      font-size: clamp(32px, 3.6vw, 46px);
      font-weight: 600;
      line-height: 1.01;
      letter-spacing: -0.04em;
      color: #ffffff;
      margin: 13px 0 0;
      max-width: 540px;
    }
    .tt-hero-sub {
      font-size: 15.5px;
      line-height: 1.49;
      letter-spacing: -0.01em;
      color: rgba(255, 255, 255, 0.9);
      max-width: 470px;
      margin: 16px 0 0;
    }
    .tt-hero-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 24px; }
    .tt-hero-actions .tt-btn-primary {
      padding: 10px 22px;
      background: var(--action);
      border-color: var(--action);
      color: var(--on-action);
    }
    .tt-hero-ghost {
      padding: 10px 20px;
      background: rgba(255, 255, 255, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.52);
      color: #ffffff;
      backdrop-filter: blur(4px);
    }
    .tt-hero-ghost:hover { background: rgba(255, 255, 255, 0.26); }
    .tt-hero-art { position: relative; z-index: 1; min-height: 196px; }
    .tt-hero-card {
      position: relative;
      margin-left: auto;
      max-width: 344px;
      background: #ffffff;
      border-radius: var(--radius);
      padding: 16px 18px;
      color: var(--color-obsidian);
      box-shadow: 0 24px 70px rgba(16, 55, 132, 0.22);
      transform: rotate(2deg);
    }
    .tt-hero-card-back {
      position: absolute;
      top: 24px;
      right: 8px;
      width: 90%;
      height: 164px;
      background: rgba(255, 255, 255, 0.55);
      border-radius: var(--radius);
      transform: rotate(-4deg);
      box-shadow: 0 20px 60px rgba(16, 55, 132, 0.16);
    }
    @media (max-width: 980px) {
      .tt-hero { grid-template-columns: 1fr; padding: 36px 30px; }
      .tt-hero-art { display: none; }
    }

    /* ---- Feature band ----
       A white editorial card for screens that used to carry their own
       photographic hero. Same family as the Home band, without the sky: the
       gradient stays exclusive to Home and first-run. */
    .tt-feature {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 30px 32px;
      box-shadow: var(--shadow-2);
    }
    .tt-feature-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.12fr) minmax(260px, 0.88fr);
      gap: 30px;
      align-items: center;
    }
    .tt-feature-title {
      font-family: var(--font-display);
      font-size: clamp(24px, 2.5vw, 32px);
      font-weight: 600;
      line-height: 1.06;
      letter-spacing: -0.04em;
      color: var(--text);
      margin: 12px 0 0;
    }
    .tt-feature-sub {
      font-size: var(--text-sm);
      line-height: 1.55;
      color: var(--text-secondary);
      margin: 12px 0 0;
      max-width: 460px;
    }
    .tt-feature-examples {
      background: var(--surface-2);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }
    @media (max-width: 1080px) {
      .tt-feature-grid { grid-template-columns: 1fr; gap: 22px; }
    }

    /* HotkeyRecorder keycap: pulsing accent glow while capturing. */
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 6px color-mix(in srgb, var(--accent) 18%, transparent); }
      50% { box-shadow: 0 0 14px color-mix(in srgb, var(--accent) 38%, transparent); }
    }
    @keyframes cursorBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-thumb { background: #dcdde2; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #c9cad1; }
    .tt-scroll-thin { overflow-y: auto; }
    .tt-scroll-thin::-webkit-scrollbar { width: 5px; }
    .tt-scroll-thin::-webkit-scrollbar-track { background: transparent; }
    .tt-scroll-thin::-webkit-scrollbar-thumb {
      background: color-mix(in srgb, var(--text-tertiary) 45%, transparent);
      border-radius: 3px;
    }
    .tt-scroll-thin::-webkit-scrollbar-thumb:hover { background: var(--text-tertiary); }

    /* ---- Post-v0.2.6 compatibility ----
       The Settings screen and the pill work are kept from the newer tree and
       still carry these class names; render them with the Letters geometry so
       they do not reintroduce a different world. */
    .tt-page { max-width: 1200px; margin: 0; }
    .tt-page-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }
    .tt-page-title {
      font-family: var(--font-display);
      font-size: var(--text-2xl);
      font-weight: 600;
