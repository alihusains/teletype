<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teletype</title>
  <style>
    /* Self-hosted Inter (variable, 100–900). Served from /fonts — never
       fetched from a network font service at runtime. */
    @font-face {
      font-family: "InterVariable";
      src: url("/fonts/InterVariable.woff2") format("woff2");
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }
    :root {
      --bg: #ffffff;
      --surface: #ffffff;
      --surface-2: #fafafa;
      --surface-hover: #f1f1f1;
      --border: #cdcdcd;
      --border-subtle: #ebebeb;
      --text: #000000;
      --text-secondary: #5c5c5c;
      --text-tertiary: #a0a0a0;
      --accent: #11a8ff;
      --accent-hover: #0b96e6;
      --accent-strong: #0678b8;
      --accent-strong-hover: #05679e;
      --accent-soft: #e9f7ff;
      --accent-ink: #0678b8;
      --on-accent: #ffffff;
      --danger: #d92d20;
      --danger-soft: #fef3f2;
      --success: #01ca45;
      --success-soft: #e9fbf0;
      --warning: #b7791f;
      --warning-soft: #fbefaf;
      --violet: #a050ff;
      --pink: #f6a6a6;
      --scrim: rgba(0, 0, 0, 0.45);

      /* Elevation. Cards never carry a drawn 1px border — the hairline ring
         inside the shadow stack is what separates a surface from the page. */
      --shadow-1: 0 0 0 1px rgba(0,0,0,0.06), 0 1px 1px -0.5px rgba(0,0,0,0.06), 0 3px 3px -1.5px rgba(0,0,0,0.06);
      --shadow-2: 0 0 0 1px rgba(0,0,0,0.07), 0 2px 4px -1px rgba(0,0,0,0.06), 0 10px 28px -10px rgba(0,0,0,0.12);
      --shadow-3: 0 0 0 1px rgba(0,0,0,0.08), 0 16px 48px -16px rgba(0,0,0,0.22);
      --ring: 0 0 0 3px color-mix(in srgb, var(--accent) 28%, transparent);

      --radius: 12px;
      --radius-sm: 8px;
      --radius-xs: 6px;
      --radius-pill: 999px;

      --text-xs: 11.5px;
      --text-sm: 12.5px;
      --text-md: 14px;
      --text-lg: 17px;
      --text-xl: 22px;
      --tracking-tight: -0.015em;
      --tracking-display: -0.025em;

      --ease: cubic-bezier(0.2, 0, 0.13, 1);
      --dur-fast: 120ms;
      --dur: 180ms;

      --chart-1: #11a8ff;
      --chart-2: #a050ff;
      --chart-3: #01ca45;
      --chart-4: #b7791f;
      --chart-5: #f6a6a6;
      --chart-grid: #ebebeb;
    }
    /* Dark palette. Applied when the app forces dark (data-theme="dark") or
       when the OS prefers dark and the app setting is not pinned to light.
       A forced light (data-theme="light") never matches either selector, so
       it always wins over an OS dark preference. */
    :root[data-theme="dark"] {
      --bg: #0b0b0d;
      --surface: #141416;
      --surface-2: #101012;
      --surface-hover: #1d1d21;
      --border: #2e2e33;
      --border-subtle: #232327;
      --text: #f4f4f5;
      --text-secondary: #a1a1aa;
      --text-tertiary: #8b8b95;
      --accent: #38b6ff;
      --accent-hover: #5cc4ff;
      --accent-strong: #38b6ff;
      --accent-strong-hover: #5cc4ff;
      --accent-soft: rgba(56,182,255,0.14);
      --accent-ink: #8fd4ff;
      --on-accent: #04121a;
      --danger: #ff6b6b;
      --danger-soft: rgba(255,107,107,0.12);
      --success: #35d06a;
      --success-soft: rgba(53,208,106,0.12);
      --warning: #fbbf24;
      --warning-soft: rgba(251,191,36,0.12);
      --violet: #b98aff;
      --pink: #f6a6a6;
      --scrim: rgba(0, 0, 0, 0.65);
      --shadow-1: 0 0 0 1px rgba(255,255,255,0.08), 0 1px 2px rgba(0,0,0,0.45);
      --shadow-2: 0 0 0 1px rgba(255,255,255,0.10), 0 10px 28px -10px rgba(0,0,0,0.65);
      --shadow-3: 0 0 0 1px rgba(255,255,255,0.12), 0 20px 56px -16px rgba(0,0,0,0.75);
      --ring: 0 0 0 3px color-mix(in srgb, var(--accent) 40%, transparent);
      --chart-1: #38b6ff;
      --chart-2: #b98aff;
      --chart-3: #35d06a;
      --chart-4: #fbbf24;
      --chart-5: #f6a6a6;
      --chart-grid: #232327;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0b0b0d;
        --surface: #141416;
        --surface-2: #101012;
        --surface-hover: #1d1d21;
        --border: #2e2e33;
        --border-subtle: #232327;
        --text: #f4f4f5;
        --text-secondary: #a1a1aa;
        --text-tertiary: #8b8b95;
        --accent: #38b6ff;
        --accent-hover: #5cc4ff;
        --accent-strong: #38b6ff;
        --accent-strong-hover: #5cc4ff;
        --accent-soft: rgba(56,182,255,0.14);
        --accent-ink: #8fd4ff;
        --on-accent: #04121a;
        --danger: #ff6b6b;
        --danger-soft: rgba(255,107,107,0.12);
        --success: #35d06a;
        --success-soft: rgba(53,208,106,0.12);
        --warning: #fbbf24;
        --warning-soft: rgba(251,191,36,0.12);
        --violet: #b98aff;
        --pink: #f6a6a6;
        --scrim: rgba(0, 0, 0, 0.65);
        --shadow-1: 0 0 0 1px rgba(255,255,255,0.08), 0 1px 2px rgba(0,0,0,0.45);
        --shadow-2: 0 0 0 1px rgba(255,255,255,0.10), 0 10px 28px -10px rgba(0,0,0,0.65);
        --shadow-3: 0 0 0 1px rgba(255,255,255,0.12), 0 20px 56px -16px rgba(0,0,0,0.75);
        --ring: 0 0 0 3px color-mix(in srgb, var(--accent) 40%, transparent);
        --chart-1: #38b6ff;
        --chart-2: #b98aff;
        --chart-3: #35d06a;
        --chart-4: #fbbf24;
        --chart-5: #f6a6a6;
        --chart-grid: #232327;
      }
    }
    /* Reduce Motion: the app setting (data-motion="reduced") forces it; when
       the setting is off (not "full") the OS preference still applies. */
    :root[data-motion="reduced"] *,
    :root[data-motion="reduced"] *::before,
    :root[data-motion="reduced"] *::after {
      animation-duration: 0.001s !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001s !important;
    }
    @media (prefers-reduced-motion: reduce) {
      :root:not([data-motion="full"]) *,
      :root:not([data-motion="full"]) *::before,
      :root:not([data-motion="full"]) *::after {
        animation-duration: 0.001s !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001s !important;
      }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "InterVariable", "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    ::selection {
      background: color-mix(in srgb, var(--accent) 25%, transparent);
      color: var(--text);
    }
    button {
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 0 12px;
      min-height: 32px;
      background: var(--surface);
      color: var(--text);
      transition: background var(--dur-fast) var(--ease),
        border-color var(--dur-fast) var(--ease);
    }
    button:hover { background: var(--surface-hover); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    button.primary:disabled,
    .tt-btn-primary:disabled {
      background: var(--surface-2);
      color: var(--text-tertiary);
      border-color: var(--border-subtle);
      opacity: 1;
    }
    button.primary {
      background: var(--accent-strong);
      color: var(--on-accent);
      border-color: var(--accent-strong);
    }
    button.primary:hover { background: var(--accent-strong-hover); border-color: var(--accent-strong-hover); }
    button.danger { color: var(--danger); }
    /* Keyboard focus needs to be obvious and needs to not appear on mouse
       click. `:focus-visible` is what separates the two. */
    :focus-visible {
      outline: none;
      box-shadow: var(--ring);
      border-radius: var(--radius-sm);
    }
    input, select, textarea {
      font-family: inherit;
      font-size: var(--text-md);
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 10px;
      height: 32px;
      border-radius: var(--radius-sm);
      outline: none;
      transition: border-color var(--dur-fast) var(--ease),
        box-shadow var(--dur-fast) var(--ease);
    }
    textarea { height: auto; }
    input:focus, select:focus, textarea:focus {
      border-color: var(--accent);
      box-shadow: var(--ring);
    }
    input:disabled, select:disabled, textarea:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    input::placeholder, textarea::placeholder { color: var(--text-tertiary); }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    /* ---- Surfaces ---- */
    /* One card definition: surface + radius + shadow-as-border. No drawn
       1px border — the hairline ring in --shadow-1 does the separating. */
    .tt-card {
      background: var(--surface);
      border: 0;
      border-radius: var(--radius);
      box-shadow: var(--shadow-1);
    }
    /* Quiet surface: sidebars, tracks, and wells that sit inside cards or
       on the page without claiming card elevation. */
    .tt-card-quiet {
      background: var(--surface-2);
      border: 0;
      border-radius: var(--radius);
    }
    .tt-card-interactive {
      transition: box-shadow var(--dur) var(--ease),
        transform var(--dur) var(--ease);
    }
    .tt-card-interactive:hover {
      box-shadow: var(--shadow-2);
      transform: translateY(-1px);
    }
    /* Uppercase micro-label: sidebar group labels and micro-labels only.
       Never as a kicker above a page heading. */
    .tt-eyebrow {
      font-size: 10.5px;
      font-weight: 650;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-tertiary);
    }

    /* ---- Page scaffold ---- */
    .tt-page {
      max-width: 1120px;
      margin: 0 auto;
    }
    .tt-page-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 22px;
    }
    .tt-page-title {
      font-size: var(--text-xl);
      font-weight: 650;
      letter-spacing: var(--tracking-display);
      color: var(--text);
    }
    .tt-page-sub {
      font-size: var(--text-sm);
      color: var(--text-secondary);
      margin-top: 3px;
    }

    /* ---- Buttons ---- */
    .tt-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 32px;
      padding: 0 14px;
      font-size: 12.5px;
      font-weight: 600;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      transition: background var(--dur-fast) var(--ease),
        border-color var(--dur-fast) var(--ease),
        color var(--dur-fast) var(--ease),
        opacity var(--dur-fast) var(--ease);
    }
    .tt-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .tt-btn-primary {
      background: var(--accent-strong);
      color: var(--on-accent);
      border-color: var(--accent-strong);
    }
    .tt-btn-primary:hover {
      background: var(--accent-strong-hover);
      border-color: var(--accent-strong-hover);
      color: var(--on-accent);
    }
    .tt-btn-secondary {
      background: var(--surface);
      color: var(--text);
      border-color: transparent;
      box-shadow: var(--shadow-1);
    }
    .tt-btn-secondary:hover { background: var(--surface-hover); color: var(--text); }
    .tt-btn-ghost {
      background: transparent;
      border-color: transparent;
      color: var(--text-secondary);
    }
    .tt-btn-ghost:hover { background: var(--surface-hover); color: var(--text); }
    .tt-btn-danger {
      background: transparent;
      color: var(--danger);
      border-color: color-mix(in srgb, var(--danger) 30%, transparent);
    }
    .tt-btn-danger:hover {
      background: var(--danger-soft);
      color: var(--danger);
    }
    .tt-btn-sm {
      height: 28px;
      padding: 0 10px;
      font-size: var(--text-xs);
      border-radius: var(--radius-xs);
    }

    /* ---- Inputs ---- */
    .tt-input {
      font-family: inherit;
      font-size: var(--text-md);
      height: 32px;
      padding: 6px 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      outline: none;
      transition: border-color var(--dur-fast) var(--ease),
        box-shadow var(--dur-fast) var(--ease);
    }
    .tt-input:focus {
      border-color: var(--accent);
      box-shadow: var(--ring);
    }
    .tt-input::placeholder { color: var(--text-tertiary); }
    .tt-input:disabled { opacity: 0.45; cursor: not-allowed; }

    /* ---- Pill / chip ---- */
    .tt-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      height: 22px;
      padding: 0 10px;
      font-size: var(--text-xs);
      font-weight: 600;
      color: var(--text-secondary);
      background: transparent;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-pill);
      white-space: nowrap;
    }
    .tt-divider {
      height: 1px;
      background: var(--border-subtle);
    }

    /* ---- Section heading (retuned; still referenced by screens) ---- */
    .tt-section-title {
      font-size: var(--text-lg);
      font-weight: 650;
      letter-spacing: var(--tracking-tight);
      margin-bottom: 2px;
    }
    .tt-section-sub {
      font-size: var(--text-sm);
      color: var(--text-secondary);
    }

    /* HotkeyRecorder keycap: pulsing accent glow while capturing. */
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 6px color-mix(in srgb, var(--accent) 18%, transparent); }
      50% { box-shadow: 0 0 14px color-mix(in srgb, var(--accent) 38%, transparent); }
    }
    /* Blinking cursor bar next to "Press keys…" while capturing. */
    @keyframes cursorBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    /* Toast entrance. Opacity-only: the toasts are centred with an inline
       translateX(-50%) that the animation must not override. */
    @keyframes fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
