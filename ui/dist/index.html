<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teletype</title>
  <style>
    :root {
      --bg: #f5f6f8;
      --surface: #ffffff;
      --surface-hover: #eef1f6;
      --surface-2: #f4f6f9;
      --border: #e6e9ef;
      --text: #141821;
      --text-secondary: #6b7280;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --accent-soft: #eaf1fe;
      --danger: #ef4444;
      --success: #16a34a;
      --radius: 12px;
      --radius-sm: 8px;
    }
    /* Dark palette. Applied when the app forces dark (data-theme="dark") or
       when the OS prefers dark and the app setting is not pinned to light.
       A forced light (data-theme="light") never matches either selector, so
       it always wins over an OS dark preference. */
    :root[data-theme="dark"] {
      --bg: #101014;
      --surface: #1a1a22;
      --surface-hover: #22222c;
      --surface-2: #16161c;
      --border: #2a2a34;
      --text: #ececf1;
      --text-secondary: #9a9aa8;
      --accent: #4f8ef7;
      --accent-hover: #6ba0f9;
      --accent-soft: #1c2740;
      --danger: #f87171;
      --success: #4ade80;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #101014;
        --surface: #1a1a22;
        --surface-hover: #22222c;
        --surface-2: #16161c;
        --border: #2a2a34;
        --text: #ececf1;
        --text-secondary: #9a9aa8;
        --accent: #4f8ef7;
        --accent-hover: #6ba0f9;
        --accent-soft: #1c2740;
        --danger: #f87171;
        --success: #4ade80;
      }
    }
    /* Reduce Motion: the app setting (data-motion="reduced") forces it; when
       the setting is off (not "full") the OS preference still applies. */
    :root[data-motion="reduced"] *,
    :root[data-motion="reduced"] *::before,
    :root[data-motion="reduced"] *::after {
      animation-duration: 0.001s !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001s !important;
    }
    @media (prefers-reduced-motion: reduce) {
      :root:not([data-motion="full"]) *,
      :root:not([data-motion="full"]) *::before,
      :root:not([data-motion="full"]) *::after {
        animation-duration: 0.001s !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001s !important;
      }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    button {
      font-family: inherit;
      font-size: inherit;
      cursor: pointer;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 6px 12px;
      background: var(--surface);
      color: var(--text);
      transition: background 0.15s, border-color 0.15s;
    }
    button:hover { background: var(--surface-hover); }
    button.primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    button.primary:hover { background: var(--accent-hover); }
    button.danger { color: var(--danger); }
    input, select, textarea {
      font-family: inherit;
      font-size: inherit;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      padding: 8px 10px;
      outline: none;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); }
    /* HotkeyRecorder keycap: pulsing accent glow while capturing. */
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 6px color-mix(in srgb, var(--accent) 18%, transparent); }
      50% { box-shadow: 0 0 14px color-mix(in srgb, var(--accent) 38%, transparent); }
    }
    /* Blinking cursor bar next to "Press keys…" while capturing. */
    @keyframes cursorBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  </style>
  <script type="module" crossorigin src="./assets/main-Cqy53wZg.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/pill-Ck77bJjh.js">
</head>
<body>
  <div id="root"></div>
</body>
</html>
