<!doctype html>
<html lang="en" class="pill-window">
  <head>
    <meta charset="UTF-8" />
    <title>Teletype Recorder</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body, #root {
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
        user-select: none;
        cursor: default;
      }
      @keyframes fade-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes pop-in {
        from { opacity: 0; transform: scale(0.9); }
        to { opacity: 1; transform: scale(1); }
      }
      @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes ping {
        0% { transform: scale(1); opacity: 0.6; }
        75%, 100% { transform: scale(2.2); opacity: 0; }
      }
      @keyframes hairline-breathe {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.65; }
      }
      /* Agentic cue for the polish/transform stage: a sparkle that pulses
         (scale + opacity only, so it never scales past the window box).
         Holds still under reduced motion via the global rule below. */
      @keyframes sparkle-pulse {
        0%, 100% { transform: scale(0.82); opacity: 0.55; }
        50% { transform: scale(1.12); opacity: 1; }
      }
      @keyframes well-fade-top {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      /* Glow pill (ui/src/pillGlow.tsx). Every glow motion is a transform or
         an opacity change: the window is sized to the pill box, so nothing
         may scale past it. */
      @keyframes glow-spin {
        to { transform: rotate(360deg); }
      }
      @keyframes glow-breathe {
        0%, 100% { opacity: 0.45; }
        50% { opacity: 0.8; }
      }
      @keyframes glow-beat {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.55; }
      }
      @keyframes glow-settle {
        from { opacity: 1; }
        to { opacity: 0.5; }
      }
      /* Reduce Motion: the pill is a separate webview, so index.html's rules
         do not reach it; these mirror them. The app setting
         (data-motion="reduced", set by pill.tsx) forces it; when the setting
         is off (not "full") the OS preference still applies. The JS loops
         (dot grid, glow) follow the same pair through useReducedMotion.
         Glow cross-fades (data-glow-fade) are exempt: they carry meaning, so
         the JS keeps them at 120ms instead of cutting them. */
      :root[data-motion="reduced"] *:not([data-glow-fade]),
      :root[data-motion="reduced"] *::before,
      :root[data-motion="reduced"] *::after {
        animation-duration: 0.001s !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001s !important;
      }
      @media (prefers-reduced-motion: reduce) {
        :root:not([data-motion="full"]) *:not([data-glow-fade]),
        :root:not([data-motion="full"]) *::before,
        :root:not([data-motion="full"]) *::after {
          animation-duration: 0.001s !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.001s !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Suppress the native context menu in the pill overlay.
      document.addEventListener("contextmenu", (e) => e.preventDefault());
    </script>
    <script type="module" src="/src/pillEntry.tsx"></script>
  </body>
</html>
