<!doctype html>
<html lang="en" class="pill-window">
  <head>
    <meta charset="UTF-8" />
    <title>Teletype Recorder</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body, #root {
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
        user-select: none;
        cursor: default;
      }
      @keyframes fade-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes pop-in {
        from { opacity: 0; transform: scale(0.9); }
        to { opacity: 1; transform: scale(1); }
      }
      @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes ping {
        0% { transform: scale(1); opacity: 0.6; }
        75%, 100% { transform: scale(2.2); opacity: 0; }
      }
      @keyframes hairline-breathe {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.65; }
      }
      @keyframes well-fade-top {
        from { opacity: 0; }
        to { opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Suppress the native context menu in the pill overlay.
      document.addEventListener("contextmenu", (e) => e.preventDefault());
    </script>
    <script type="module" src="/src/pill.tsx"></script>
  </body>
</html>
