[workspace]
resolver = "2"
members = [
    "crates/parakeet-sys",
    "crates/teletype-core",
    "crates/teletype-speech",
    "crates/teletype-inference",
    "crates/teletype-desktop",
    "crates/teletype-eval",
]

[workspace.package]
version = "0.2.5"
edition = "2021"
rust-version = "1.90"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
cpal = "0.18"
arboard = "3"
enigo = "0.6"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
regex = "1"
silero-vad-pure = { version = "0.1.1", default-features = false }

[profile.release]
lto = true
codegen-units = 1

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
dbg_macro = "warn"
todo = "warn"
