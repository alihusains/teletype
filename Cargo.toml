[workspace]
resolver = "2"
members = [
    "crates/parakeet-sys",
    "crates/parakeet-cpp-sys",
    "crates/teletype-core",
    "crates/teletype-speech",
    "crates/teletype-inference",
    "crates/teletype-desktop",
    "crates/teletype-eval",
]
exclude = [
    "crates/teletype-core/fuzz",
    "crates/teletype-inference/fuzz",
]

[workspace.package]
version = "0.2.6"
edition = "2021"
rust-version = "1.90"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
cpal = "0.18"
arboard = "3"
enigo = "0.6"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
regex = "1"
silero-vad-pure = { version = "0.1.1", default-features = false }
arc-swap = "1"
tokio = { version = "1", features = ["sync"] }
# `bundled` compiles SQLite in-tree so CI needs no system libsqlite.
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
lto = true
codegen-units = 1

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
dbg_macro = "warn"
todo = "warn"
