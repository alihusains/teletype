[workspace]
resolver = "2"
members = [
    "crates/parakeet-sys",
    "crates/needle-sys",
    "crates/parakeet-cpp-sys",
    "crates/teletype-core",
    "crates/teletype-speech",
    "crates/teletype-fluid",
    "crates/teletype-inference",
    "crates/teletype-desktop",
    "crates/teletype-eval",
    "crates/teletype-decider",
]
exclude = [
    "crates/teletype-core/fuzz",
    "crates/teletype-inference/fuzz",
]

[workspace.package]
version = "0.2.7"
edition = "2021"
rust-version = "1.90"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
cpal = "0.18"
arboard = "3"
enigo = "0.6"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
proptest = "1"
regex = "1"
silero-vad-pure = { version = "0.1.1", default-features = false }
nnnoiseless = "0.5"
# DeepFilterNet3-LL ONNX inference (plan §5.5): same crate as teletype-decider.
# `=` is deliberate: rc.14 requires rustc 1.92 (workspace rust-version is 1.90)
# and rc.15 changed `SessionBuilder::new` to take `&Environment`, which this
# code does not use. A caret requirement let the detached `fuzz/` workspace
# resolve rc.15 from scratch and fail to compile teletype-core there.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "load-dynamic"] }
arc-swap = "1"
tokio = { version = "1", features = ["sync"] }
# `bundled` compiles SQLite in-tree so CI needs no system libsqlite.
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
# Off, not `true`/`thin`. The macOS shipping link of `teletype-desktop` fails
# with "failed to get bitcode from object file for LTO (Can't find section
# __bitcode)" under BOTH fat and thin LTO, because it links clang/Swift-built
# static archives (parakeet/ggml, and the Nemo `libtext_processing_rs.a` xc
# framework slice) that carry native code, not matching LLVM bitcode. The
# app's runtime is dominated by the inference libraries, so Rust-side LTO
# inlining is not worth a binary that cannot link on release day.
lto = false
codegen-units = 1

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
dbg_macro = "warn"
todo = "warn"
