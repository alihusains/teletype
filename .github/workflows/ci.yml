name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  RUST_BACKTRACE: 1

jobs:
  # 1) Fast gate: typecheck + unit tests. Runs on push and PR.
  test:
    name: Test (Rust + UI)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install UI deps
        run: cd ui && npm ci
      - name: UI typecheck
        run: cd ui && npx tsc --noEmit
      - name: Rust tests (core)
        run: cargo test -p teletype-core --lib
      - name: Rust tests (desktop)
        run: cargo test -p teletype-desktop --lib

  # 2) Windows gate: the workspace must compile on a real Windows host
  #    (windows-latest, MSVC). This catches anything the macOS host cannot
  #    see: winapi feature gaps, Windows-only code paths, and the
  #    whisper-rs C build under MSVC. Cross-compiling from macOS is not
  #    viable (C dependencies like `ring` need a native MSVC toolchain).
  windows-compile:
    name: Windows compile check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
      - name: cargo check (windows msvc)
        run: cargo check --workspace

  # 3) Build the macOS .app for internal testers.
  release-macos:
    name: Build macOS app
    runs-on: macos-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
          components: "rustfmt"
      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2" --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build llama-server (Metal, static)
        run: ./scripts/build-llama-server.sh
      - name: Build Tauri app
        run: cargo tauri build
      - name: Upload .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: teletype-macos-app
          path: crates/teletype-desktop/target/release/bundle/macos/*.app
      - name: Upload .dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: teletype-macos-dmg
          path: crates/teletype-desktop/target/release/bundle/dmg/*.dmg
