name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  RUST_BACKTRACE: 1

# Shared cache configuration.
#
# `RUSTC_WRAPPER` is the whole reason the sccache steps below used to be dead
# weight: cargo only routes compilations through sccache when RUSTC_WRAPPER
# points at it. Without this line sccache was installed, given a cache
# directory, and cached, while cargo built everything itself and sccache
# stored almost nothing (the intel sccache cache was 8.84 MiB for a build that
# compiles all of whisper.cpp and llama.cpp). Set it only in jobs that install
# sccache first: RUSTC_WRAPPER pointing at a missing binary is a hard cargo
# error, not a warning.
#
# Caches are keyed per job. Parallel jobs that share one key race to save it
# and all but the winner silently skip the write, so the loser is left cold
# forever. Per-job keys guarantee every job gets its own cache the first time
# it goes green.

jobs:
  # ---------------------------------------------------------------------------
  # Rust jobs are split per crate family and run in parallel on purpose.
  #
  # They used to be three sequential steps in one job: core (2m) + desktop
  # (14m) + inference/speech (22m) = 37m of a 39m run, with the C++ cost of
  # whisper.cpp and llama.cpp paid from scratch every time. As independent jobs
  # the wall clock is the slowest one rather than their sum.
  #
  # The split is safe because these crates do not depend on each other's test
  # artifacts: teletype-core and teletype-speech are leaves, teletype-inference
  # depends on core+speech, teletype-desktop depends on all three. Nothing here
  # shares mutable state; they only share source, which checkout provides.
  # ---------------------------------------------------------------------------

  # 1) Cheap, compile-free gates. Fails in ~1m so a broken notices check does
  #    not cost a 20-minute wait to find out.
  checks:
    name: Checks (notices, manifest, UI types)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.90"
          components: "rustfmt"
      - name: No build artifacts staged
        run: bash scripts/check-no-built-binaries.sh
      - name: Check third-party notices sync
        run: bash scripts/check-notices.sh
      - name: Check the updater manifest assembly
        run: bash scripts/check-updater-manifest.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install UI deps
        run: cd ui && npm ci
      - name: UI typecheck
        run: cd ui && npx tsc --noEmit

  # 2) Format + clippy. Split from the test jobs so a lint failure does not
  #    wait behind two C/C++ builds, and so clippy has its own cargo cache
  #    (clippy uses different fingerprints than `cargo test`, so it can never
  #    reuse the test jobs' target dir anyway).
  lint:
    name: Lint (fmt + clippy)
    runs-on: macos-latest
    env:
      SCCACHE_DIR: ${{ github.workspace }}/.sccache-cache
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cargo-target-cache
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.90"
          # `clippy` is load-bearing, not optional. The action installs
          # `--profile minimal`, which is rustc + rust-std + cargo and *no*
          # clippy, so asking for rustfmt alone leaves `cargo clippy` broken:
          # it exits 1 with "error: 'cargo-clippy' is not installed" on stderr
          # and writes nothing to stdout. That failure surfaced as an opaque
          # red step that printed "clippy: clean" immediately before dying,
          # which reads like the linter ran and passed. It never ran. Every
          # "fix the clippy warnings failing CI" commit before this was
          # chasing a linter CI had never once executed.
          components: "rustfmt, clippy"
      - name: Install sccache
        run: brew install sccache 2>/dev/null || true
      - name: Point cargo at sccache
        # Conditional on purpose. RUSTC_WRAPPER naming a binary that is not
        # there is a hard cargo error, not a warning, so exporting it blindly
        # would turn "brew was slow today" into a red build. `sccache` is
        # preinstalled on GitHub's macOS images and `brew install` is only a
        # fallback, but a fallback that can fail still has to be survivable.
        run: |
          if command -v sccache >/dev/null 2>&1; then
            echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
            sccache --show-stats || true
          else
            echo "::warning::sccache not on PATH; building without it (slower, still correct)"
          fi
      - name: Cache sccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.sccache-cache
          key: sccache-ci-lint-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            sccache-ci-lint-${{ runner.arch }}-
      - name: Cache cargo target
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cargo-target-cache
          key: cargo-target-ci-lint-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-target-ci-lint-${{ runner.arch }}-
      - name: Stub the bundled llama-server binary
        # `--all-targets` builds teletype-desktop's build script, and
        # tauri-build fails with "resource path binaries/llama-server doesn't
        # exist" when the path is missing (tauri.conf.json declares it as a
        # bundle resource). The real binary is produced by
        # scripts/build-llama-server.sh at release time.
        run: |
          mkdir -p crates/teletype-desktop/binaries
          touch crates/teletype-desktop/binaries/llama-server
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        # No `2>/dev/null` here. The JSON stream on stdout is the only thing
        # check-clippy-clean.py reads, but cargo's own diagnostics (missing
        # clippy component, a compile error, a build-script failure) go to
        # stderr, and discarding them turns a hard, explainable failure into a
        # bare "Process completed with exit code 1". Let stderr reach the log.
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets --message-format=json \
            | python3 scripts/check-clippy-clean.py

  # 3) Leaf crates: no llama.cpp, no Tauri. Fastest signal in the workspace.
  test-core:
    name: Tests (core, speech)
    runs-on: macos-latest
    env:
      SCCACHE_DIR: ${{ github.workspace }}/.sccache-cache
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cargo-target-cache
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.90"
      - name: Install sccache
        run: brew install sccache 2>/dev/null || true
      - name: Point cargo at sccache
        # Conditional on purpose. RUSTC_WRAPPER naming a binary that is not
        # there is a hard cargo error, not a warning, so exporting it blindly
        # would turn "brew was slow today" into a red build. `sccache` is
        # preinstalled on GitHub's macOS images and `brew install` is only a
        # fallback, but a fallback that can fail still has to be survivable.
        run: |
          if command -v sccache >/dev/null 2>&1; then
            echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
            sccache --show-stats || true
          else
            echo "::warning::sccache not on PATH; building without it (slower, still correct)"
          fi
      - name: Cache sccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.sccache-cache
          key: sccache-ci-core-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            sccache-ci-core-${{ runner.arch }}-
      - name: Cache cargo target
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cargo-target-cache
          key: cargo-target-ci-core-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-target-ci-core-${{ runner.arch }}-
      - name: Rust tests (core)
        run: cargo test -p teletype-core
      - name: Confirmed defects still reproduce
        run: cargo test -p teletype-core --test journey_smoke -- --ignored
        continue-on-error: true
      # speech builds whisper.cpp through parakeet-sys, so this step is not
      # as cheap as its crate suggests. It lives here rather than in its own
      # job because it is the same dependency graph teletype-inference needs.
      - name: Rust tests (speech)
        run: cargo test -p teletype-speech

  # 4) The heaviest crate: llama.cpp plus everything under it.
  test-inference:
    name: Tests (inference)
    runs-on: macos-latest
    env:
      SCCACHE_DIR: ${{ github.workspace }}/.sccache-cache
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cargo-target-cache
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.90"
      - name: Install sccache
        run: brew install sccache 2>/dev/null || true
      - name: Point cargo at sccache
        # Conditional on purpose. RUSTC_WRAPPER naming a binary that is not
        # there is a hard cargo error, not a warning, so exporting it blindly
        # would turn "brew was slow today" into a red build. `sccache` is
        # preinstalled on GitHub's macOS images and `brew install` is only a
        # fallback, but a fallback that can fail still has to be survivable.
        run: |
          if command -v sccache >/dev/null 2>&1; then
            echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
            sccache --show-stats || true
          else
            echo "::warning::sccache not on PATH; building without it (slower, still correct)"
          fi
      - name: Cache sccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.sccache-cache
          key: sccache-ci-inference-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            sccache-ci-inference-${{ runner.arch }}-
      - name: Cache cargo target
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cargo-target-cache
          key: cargo-target-ci-inference-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-target-ci-inference-${{ runner.arch }}-
      - name: Rust tests (inference)
        run: cargo test -p teletype-inference

  # 5) The Tauri app crate. Needs the llama-server stub because running its
  #    tests executes tauri-build.
  test-desktop:
    name: Tests (desktop)
    runs-on: macos-latest
    env:
      SCCACHE_DIR: ${{ github.workspace }}/.sccache-cache
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cargo-target-cache
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.90"
      - name: Install sccache
        run: brew install sccache 2>/dev/null || true
      - name: Point cargo at sccache
        # Conditional on purpose. RUSTC_WRAPPER naming a binary that is not
        # there is a hard cargo error, not a warning, so exporting it blindly
        # would turn "brew was slow today" into a red build. `sccache` is
        # preinstalled on GitHub's macOS images and `brew install` is only a
        # fallback, but a fallback that can fail still has to be survivable.
        run: |
          if command -v sccache >/dev/null 2>&1; then
            echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
            sccache --show-stats || true
          else
            echo "::warning::sccache not on PATH; building without it (slower, still correct)"
          fi
      - name: Cache sccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.sccache-cache
          key: sccache-ci-desktop-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            sccache-ci-desktop-${{ runner.arch }}-
      - name: Cache cargo target
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cargo-target-cache
          key: cargo-target-ci-desktop-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-target-ci-desktop-${{ runner.arch }}-
      - name: Stub the bundled llama-server binary
        run: |
          mkdir -p crates/teletype-desktop/binaries
          touch crates/teletype-desktop/binaries/llama-server
      - name: Rust tests (desktop)
        run: cargo test -p teletype-desktop

  # 2) Dictation quality gate: replay eval harness against committed hypotheses.
  eval:
    name: Dictation eval (replay)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.90"
      - name: Rust tests (eval)
        run: cargo test -p teletype-eval
      - name: Eval harness (replay + threshold gate)
        run: |
          cargo run -p teletype-eval --bin eval -- \
            --corpus evals/corpus \
            --asr none \
            --hypotheses evals/hypotheses.jsonl \
            --thresholds evals/thresholds.json \
            --report evals/report.md \
            --json evals/report.json
      - name: Fail if the committed report is stale
        # The report embeds the git SHA and a wall-clock timestamp, so a
        # byte-exact diff would always fail. Compare only the quality
        # metrics (WER, polish, latency percentiles, threshold gate).
        run: |
          strip_meta() {
            grep -v '^\- \*\*Git SHA:\*\*' "$1" \
              | grep -v '^\- \*\*Timestamp:\*\*' \
              | grep -v '^  "git_sha"' \
              | grep -v '^  "timestamp"'
          }
          diff <(strip_meta evals/report.md) <(strip_meta <(git show HEAD:evals/report.md)) \
            && diff <(strip_meta evals/report.json) <(strip_meta <(git show HEAD:evals/report.json))

  # 3) Windows compile gate: the workspace must compile on a real Windows host.
  windows-compile:
    name: Windows compile check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.90"
      - name: Stub the bundled llama-server binary
        # tauri.conf.json declares binaries/llama-server as a resource;
        # tauri-build fails if the path is missing. The real binary is
        # produced by scripts/build-llama-server.sh at release time.
        # Create both the bare path and the .exe-suffixed path to cover
        # whichever tauri-build checks on Windows.
        run: |
          New-Item -ItemType Directory -Path crates/teletype-desktop/binaries -Force | Out-Null
          New-Item -ItemType File -Path crates/teletype-desktop/binaries/llama-server -Force | Out-Null
          New-Item -ItemType File -Path crates/teletype-desktop/binaries/llama-server.exe -Force | Out-Null
      - name: cargo check (windows msvc)
        run: cargo check --workspace

  # 4) macOS Intel compile gate (non-blocking). Catches x86_64 regressions on
  #    push rather than at the next tag. Full Intel app build lives in
  #    release.yml; this is a fast `cargo check` only.
  macos-intel-check:
    name: macOS Intel (x86_64) compile check
    runs-on: macos-latest
    continue-on-error: true
    env:
      CC_x86_64_apple_darwin: clang
      CXX_x86_64_apple_darwin: clang++
      CFLAGS_x86_64_apple_darwin: "-arch x86_64 -mmacosx-version-min=15.0"
      CXXFLAGS_x86_64_apple_darwin: "-arch x86_64 -mmacosx-version-min=15.0"
      CMAKE_OSX_ARCHITECTURES: x86_64
      CMAKE_OSX_DEPLOYMENT_TARGET: "15.0"
      RUSTFLAGS: "-C link-arg=-mmacosx-version-min=15.0"
      SCCACHE_DIR: ${{ github.workspace }}/.sccache-cache
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cargo-target-cache
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.90"
      - name: Add the x86_64 target
        run: rustup target add x86_64-apple-darwin
      - name: Stub the bundled llama-server binary
        # tauri.conf.json declares binaries/llama-server as a resource;
        # tauri-build fails if the path is missing. The real binary is
        # produced by scripts/build-llama-server.sh at release time.
        # (Same stub as the windows-compile job.)
        run: |
          mkdir -p crates/teletype-desktop/binaries
          touch crates/teletype-desktop/binaries/llama-server
      - name: Install sccache
        run: brew install sccache 2>/dev/null || true
      - name: Point cargo at sccache
        # Conditional on purpose. RUSTC_WRAPPER naming a binary that is not
        # there is a hard cargo error, not a warning, so exporting it blindly
        # would turn "brew was slow today" into a red build. `sccache` is
        # preinstalled on GitHub's macOS images and `brew install` is only a
        # fallback, but a fallback that can fail still has to be survivable.
        run: |
          if command -v sccache >/dev/null 2>&1; then
            echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
            sccache --show-stats || true
          else
            echo "::warning::sccache not on PATH; building without it (slower, still correct)"
          fi
      - name: Cache sccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.sccache-cache
          key: sccache-ci-intel-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            sccache-ci-intel-
      - name: Cache cargo target
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cargo-target-cache
          key: cargo-target-ci-intel-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-target-ci-intel-
      - name: cargo check (x86_64)
        run: cargo check --workspace --target x86_64-apple-darwin
