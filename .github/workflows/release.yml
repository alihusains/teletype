name: Release

on:
  push:
    tags:
      - "v*"

# Builds, signs, notarizes, and publishes the macOS and Windows releases, plus
# the updater manifest that makes in-app updates work.
#
# Three jobs build independently (macOS and Windows cannot cross-compile the C
# speech engines), then each publishes its own artifacts to the same tag-based
# release. macOS reuses the exact steps proven in ci.yml's release-macos job,
# including the macOS 15.0 deployment target that keeps ggml-metal's
# @available checks from emitting a dangling ___isPlatformVersionAtLeast
# symbol at link time.
#
# ## Intel
#
# `release-macos-intel` cross-compiles x86_64 from the same Apple Silicon host,
# so there is one macOS build story rather than a separate Intel runner. It is
# `continue-on-error`: Intel is an option we offer, not a promise we gate the
# product on, and it must never be able to block an arm64 or Windows release.
# The publish job treats its absence as normal, and only advertises
# `darwin-x86_64` when the artifact's own recorded architecture says x86_64.
#
# ## What each job produces
#
# - `.app.tar.gz` + `.app.tar.gz.sig` (macOS updater payload)
# - `*.dmg` (macOS human download)
# - `*.nsis.zip` + `*.nsis.zip.sig` (Windows updater payload)
# - `*.exe` (Windows human download)
# - `latest.json` (the updater manifest, merged by the publish job)
#
# ## Signing and notarization
#
# The updater private key (`TAURI_SIGNING_PRIVATE_KEY`) signs the update
# payloads. The Apple Developer ID (`APPLE_CERTIFICATE`) signs the app, and
# `APPLE_ID` / `APPLE_APP_SPECIFIC_PASSWORD` / `APPLE_TEAM_ID` notarize it.
#
# All four are repository secrets. None of them may be committed. Without the
# Apple credentials the workflow still publishes an unsigned build, because an
# unsigned build that reaches users beats a signed build that never ships; the
# `notarize` step is conditional and says so in the log.
#
# The public half of the updater keypair lives in
# `crates/teletype-desktop/tauri.conf.json` under `plugins.updater.pubkey`.
# That file is safe to commit: the app needs it to verify updates, and it
# cannot be used to sign anything.

permissions:
  contents: write

env:
  RUST_BACKTRACE: 1

jobs:
  release-macos:
    name: Build & publish macOS release
    runs-on: macos-latest
    env:
      # ggml-metal's ggml-metal-device.m uses @available(macOS 15.0) checks.
      # Compiling below 15.0 emits a strong reference to
      # ___isPlatformVersionAtLeast that the final link cannot resolve.
      # 15.0 makes clang fold the check away and still covers the 10.15+
      # std::filesystem requirement. whisper-rs-sys forwards any CMAKE_* env
      # var to CMake, so set the deployment target there.
      CMAKE_OSX_DEPLOYMENT_TARGET: "15.0"
      # Match the final Rust link to the same deployment target.
      RUSTFLAGS: "-C link-arg=-mmacosx-version-min=15.0"
      # sccache: cache C/C++/Rust object files across runs. The whisper.cpp +
      # ggml compilation is the expensive part and is deterministic, so a warm
      # cache cuts the Tauri build from ~7 min to ~2 min.
      SCCACHE_DIR: ${{ github.workspace }}/.sccache-cache
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cargo-target-cache
      # Consumed by `cargo tauri build` to sign the updater payload. The public
      # key is already pinned in tauri.conf.json.
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      # Tauri's Apple signing + notarization. Optional: see the header.
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Preflight - Apple certificate secret
        # A malformed APPLE_CERTIFICATE (not base64, or not a .p12) fails deep
        # inside the Tauri build with "failed to import keychain certificate"
        # after ~20 minutes of compilation. Check it first, in seconds.
        # NOTE: the failing branch must `exit 1` at top level, not inside a
        # `{ ... }` group after `||` — that only exits the subshell and lets
        # the step (and the 20-minute build) continue.
        #
        # A secret that exists in the repo but is an empty string (or
        # whitespace-only) is treated the same as an absent one: Tauri's
        # `APPLE_CERTIFICATE` handling does not distinguish them, and an
        # empty value makes `security import` fail exactly like a malformed
        # one. Trim before deciding whether to sign at all.
        run: |
          CERT="${APPLE_CERTIFICATE:-}"
          CERT_TRIMMED="$(printf '%s' "$CERT" | tr -d '[:space:]')"
          if [ -z "$CERT_TRIMMED" ]; then
            echo "No usable APPLE_CERTIFICATE secret (absent or empty): building unsigned (expected until the secret is added)."
            exit 0
          fi
          if ! echo "$CERT" | base64 -d > /tmp/cert.p12 2>/dev/null; then
            echo "::error::APPLE_CERTIFICATE is not valid base64. It must be the base64 of a .p12 file (see docs/signing-and-updates.md)."
            exit 1
          fi
          if ! openssl pkcs12 -in /tmp/cert.p12 -nokeys -passin pass:"${APPLE_CERTIFICATE_PASSWORD}" -noout 2>/dev/null; then
            echo "::error::APPLE_CERTIFICATE is not a readable .p12 (wrong APPLE_CERTIFICATE_PASSWORD, or not a .p12 export)."
            exit 1
          fi
          rm -f /tmp/cert.p12
          echo "Apple certificate secret looks valid."
      - name: Preflight - updater signing key
        # A minisign key pasted without its "# comment" header line fails with
        # "Missing comment in secret key" at bundle time. Check in seconds.
        # Same empty-string trap as the Apple certificate: an empty-but-present
        # secret must be treated as absent, or Tauri tries to decode it and
        # fails at bundle time.
        run: |
          KEY="${TAURI_SIGNING_PRIVATE_KEY:-}"
          KEY_TRIMMED="$(printf '%s' "$KEY" | tr -d '[:space:]')"
          if [ -z "$KEY_TRIMMED" ]; then
            echo "No usable TAURI_SIGNING_PRIVATE_KEY secret (absent or empty): updater artifacts will not be signed (expected until the secret is added)."
            exit 0
          fi
          if ! printf '%s\n' "$KEY" | head -1 | grep -q '^#'; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is missing its '#' comment header line. The key must be pasted in full, including the comment line at the top (tauri signer generate)."
            exit 1
          fi
          echo "Updater signing key looks valid."
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.90"
          components: "rustfmt"
      - name: Install sccache
        run: |
          brew install sccache 2>/dev/null || true
          sccache --show-stats || true
      - name: Cache sccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.sccache-cache
          key: sccache-macos-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            sccache-macos-${{ runner.arch }}-
      - name: Cache cargo target
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cargo-target-cache
          key: cargo-target-macos-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-target-macos-${{ runner.arch }}-
      - name: Install tauri-cli
        # Pin to a tauri-cli that builds on the pinned Rust 1.88 toolchain.
        # tauri-cli must match the tauri crate version in Cargo.lock.
        run: |
          if ! cargo tauri --version 2>/dev/null | grep -q "2.12.0"; then
            cargo install tauri-cli --version "2.12.0" --locked
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install UI deps
        run: cd ui && npm ci
      - name: Check third-party notices sync
        run: bash scripts/check-notices.sh
      - name: Build llama-server (Metal, static)
        run: |
          ./scripts/build-llama-server.sh
      - name: Build Tauri app
        # Signs the app (when APPLE_CERTIFICATE is present), signs the updater
        # payload, and notarizes. `createUpdaterArtifacts: true` in
        # tauri.conf.json is what produces the .app.tar.gz + .sig pair.
        #
        # An empty-but-present secret is treated as absent (see the preflight
        # step above): Tauri does not distinguish the two, and an empty value
        # fails `security import` / minisign decode exactly like a malformed
        # one. Clear the vars for this step when the preflight found nothing
        # usable, so Tauri takes its unsigned path instead of trying to sign
        # with an empty key.
        run: |
          if [ -z "$(printf '%s' "${APPLE_CERTIFICATE:-}" | tr -d '[:space:]')" ]; then
            echo "No usable APPLE_CERTIFICATE: clearing signing env for an unsigned build."
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
          fi
          if [ -z "$(printf '%s' "${TAURI_SIGNING_PRIVATE_KEY:-}" | tr -d '[:space:]')" ]; then
            echo "No usable TAURI_SIGNING_PRIVATE_KEY: clearing updater-signing env."
            unset TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          fi
          cargo tauri build --bundles app,dmg
      - name: Report signing state
        # `env` is not available in a step-level `if`, so branch in the shell.
        # An unsigned build is published deliberately (see the header): a build
        # that reaches users beats a signed build that never ships.
        run: |
          if [ -n "$(printf '%s' "${APPLE_CERTIFICATE:-}" | tr -d '[:space:]')" ]; then
            echo "Apple signing credentials present: the app is signed and notarized."
            spctl --assess --type execute --verbose \
              "$CARGO_TARGET_DIR"/release/bundle/macos/*.app
          else
            echo "::warning::No usable APPLE_CERTIFICATE secret (absent or empty). Publishing an UNSIGNED build."
            echo "::warning::macOS Gatekeeper will block first launch until the user"
            echo "::warning::right-clicks the app and opens it. Add the signing"
            echo "::warning::secrets before the next tag to ship a clean install."
          fi
      - name: Record the architecture
        # The updater manifest is assembled in the publish job, which sees both
        # macOS payloads and cannot tell them apart by filename: both are
        # Teletype.app.tar.gz. A marker written here, by the job that actually
        # built the binary, is what lets publish refuse to advertise a payload
        # under the wrong platform key. Getting this wrong is not cosmetic: a
        # `darwin-x86_64` entry pointing at an arm64 payload installs, passes
        # signature verification, and then refuses to open.
        #
        # The marker says `aarch64`, not `arm64`. `file` prints `arm64`; the
        # updater platform key, the Rust target triple and llama.cpp all say
        # `aarch64`. This writes the name the manifest keys off, and uses
        # `file` only to prove the binary really is that architecture.
        #
        # Every path here comes from $CARGO_TARGET_DIR, never from a literal.
        # Tauri honours CARGO_TARGET_DIR, and this job sets it to
        # `.cargo-target-cache`, so the build really lands in
        # `$CARGO_TARGET_DIR/release/...`. It is also a workspace build:
        # teletype-desktop is a member of the root workspace, so it shares the
        # root `target/` and has no `crates/teletype-desktop/target/` of its
        # own. A hardcoded path is therefore wrong twice over, and the
        # `test -f` below turns that into a red step after ~20 minutes.
        run: |
          BIN="$CARGO_TARGET_DIR"/release/teletype
          test -f "$BIN"
          file "$BIN" | grep -q "arm64" || {
            echo "::error::the aarch64 build is not arm64: $(file -b "$BIN")"
            exit 1
          }
          echo aarch64 > "$CARGO_TARGET_DIR"/release/bundle/macos/ARCH
          cat "$CARGO_TARGET_DIR"/release/bundle/macos/ARCH
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: |
            ${{ env.CARGO_TARGET_DIR }}/release/bundle/macos/ARCH
            ${{ env.CARGO_TARGET_DIR }}/release/bundle/macos/*.app
            ${{ env.CARGO_TARGET_DIR }}/release/bundle/macos/*.app.tar.gz
            ${{ env.CARGO_TARGET_DIR }}/release/bundle/macos/*.app.tar.gz.sig
            ${{ env.CARGO_TARGET_DIR }}/release/bundle/dmg/*.dmg
          if-no-files-found: error

  # The Intel build is a second macOS job rather than a universal binary.
  # A universal build would need one llama-server that runs on both
  # architectures, and llama.cpp is compiled per architecture, so the "universal"
  # option is really "two builds, one bundle", with a bundle that is twice the
  # size and cannot be code-signed as a single file. Two separate artifacts is
  # the smaller, simpler, and separately-updatable answer.
  #
  # An Intel Mac has no Neural Engine, so Parakeet runs on the CPU, and
  # llama.cpp's Metal backend on Intel integrated graphics is much slower than on
  # Apple Silicon. The build is correct and installable; the performance is not
  # competitive. The job is non-blocking for that reason: Intel support is an
  # option, not a promise, and it must not be able to block an arm64 release.
  release-macos-intel:
    name: Build & publish macOS Intel (x86_64) release
    runs-on: macos-latest
    continue-on-error: true
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # Cross-compile flags, shared with ci.yml's macos-intel-build. clang is a
      # universal binary so only `-arch` differs between the two builds.
      CC_x86_64_apple_darwin: clang
      CXX_x86_64_apple_darwin: clang++
      CFLAGS_x86_64_apple_darwin: "-arch x86_64 -mmacosx-version-min=15.0"
      CXXFLAGS_x86_64_apple_darwin: "-arch x86_64 -mmacosx-version-min=15.0"
      CMAKE_OSX_ARCHITECTURES: x86_64
      CMAKE_OSX_DEPLOYMENT_TARGET: "15.0"
      RUSTFLAGS: "-C link-arg=-mmacosx-version-min=15.0"
      # Consumed by scripts/build-llama-server.sh.
      TELETYPE_TARGET_TRIPLE: x86_64-apple-darwin
      # sccache + cargo cache (same strategy as the arm64 job).
      SCCACHE_DIR: ${{ github.workspace }}/.sccache-cache
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cargo-target-cache
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.90"
      - name: Add the x86_64 target
        run: rustup target add x86_64-apple-darwin
      - name: Install sccache
        run: |
          brew install sccache 2>/dev/null || true
      - name: Cache sccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.sccache-cache
          key: sccache-macos-intel-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            sccache-macos-intel-
      - name: Cache cargo target
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cargo-target-cache
          key: cargo-target-macos-intel-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-target-macos-intel-
      - name: Install tauri-cli
        run: |
          if ! cargo tauri --version 2>/dev/null | grep -q "2.12.0"; then
            cargo install tauri-cli --version "2.12.0" --locked
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install UI deps
        run: cd ui && npm ci
      - name: Check third-party notices sync
        run: bash scripts/check-notices.sh
      - name: Build llama-server (x86_64)
        run: ./scripts/build-llama-server.sh
      - name: Build Tauri app (x86_64)
        # Same empty-secret handling as the arm64 job: an empty-but-present
        # APPLE_CERTIFICATE/TAURI_SIGNING_PRIVATE_KEY is treated as absent and
        # cleared before the build, so Tauri takes its unsigned path.
        run: |
          if [ -z "$(printf '%s' "${APPLE_CERTIFICATE:-}" | tr -d '[:space:]')" ]; then
            echo "No usable APPLE_CERTIFICATE: clearing signing env for an unsigned Intel build."
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
          fi
          if [ -z "$(printf '%s' "${TAURI_SIGNING_PRIVATE_KEY:-}" | tr -d '[:space:]')" ]; then
            echo "No usable TAURI_SIGNING_PRIVATE_KEY: clearing updater-signing env."
            unset TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          fi
          cargo tauri build --target x86_64-apple-darwin --bundles app
      - name: Verify the binary really is x86_64
        # Without this, a mis-set flag would publish an arm64 app under the
        # x86_64 name: it would install, verify its own signature, and then
        # refuse to launch on the very machines this job exists to serve.
        run: |
          BIN="$CARGO_TARGET_DIR"/x86_64-apple-darwin/release/teletype
          test -f "$BIN" || { echo "no binary at $BIN"; exit 1; }
          file "$BIN"
          file "$BIN" | grep -q "x86_64" || {
            echo "::error::expected an x86_64 binary, got: $(file -b "$BIN")"
            exit 1
          }
      - name: Report signing state
        run: |
          if [ -n "$(printf '%s' "${APPLE_CERTIFICATE:-}" | tr -d '[:space:]')" ]; then
            echo "Apple signing credentials present: the Intel app is signed and notarized."
            spctl --assess --type execute --verbose \
              "$CARGO_TARGET_DIR"/x86_64-apple-darwin/release/bundle/macos/*.app
          else
            echo "::warning::No usable APPLE_CERTIFICATE secret (absent or empty). Publishing an UNSIGNED Intel build."
          fi
      - name: Record the architecture
        run: |
          BIN="$CARGO_TARGET_DIR"/x86_64-apple-darwin/release/teletype
          test -f "$BIN"
          file "$BIN" | grep -q "x86_64" || {
            echo "::error::the x86_64 build is not x86_64: $(file -b "$BIN")"
            exit 1
          }
          B="$CARGO_TARGET_DIR"/x86_64-apple-darwin/release/bundle/macos
          echo x86_64 > "$B/ARCH"
          cat "$B/ARCH"
      - name: Give the Intel assets distinct names
        # Both builds produce a file called Teletype.app.tar.gz. GitHub release
        # assets are keyed by name, so uploading both would either fail or
        # silently keep one architecture, which is the exact failure this job is
        # meant to prevent. The arm64 assets keep their existing names, so this
        # release does not change for Apple Silicon users at all.
        #
        # Renaming the .app *directory* is safe: Finder, Launchpad and Spotlight
        # read CFBundleName from the bundle's own Info.plist, not the name of
        # the enclosing folder, and the binary is still at Contents/MacOS.
        run: |
          set -euo pipefail
          B="$CARGO_TARGET_DIR"/x86_64-apple-darwin/release/bundle/macos
          mv "$B/Teletype.app" "$B/Teletype-x86_64.app"
          for f in "$B"/Teletype.app.tar.gz "$B"/Teletype.app.tar.gz.sig; do
            [ -e "$f" ] || continue
            mv "$f" "${f/Teletype.app/Teletype-x86_64.app}"
          done
          ls -1 "$B"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release-intel
          path: |
            ${{ env.CARGO_TARGET_DIR }}/x86_64-apple-darwin/release/bundle/macos/ARCH
            ${{ env.CARGO_TARGET_DIR }}/x86_64-apple-darwin/release/bundle/macos/*.app
            ${{ env.CARGO_TARGET_DIR }}/x86_64-apple-darwin/release/bundle/macos/*.app.tar.gz
            ${{ env.CARGO_TARGET_DIR }}/x86_64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error

  release-windows:
    name: Build & publish Windows release
    runs-on: windows-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      # This job has always cached .cargo-target-cache, but it never told
      # cargo to use it, so the cache was written and then ignored: cargo built
      # into the workspace default `target/` and the cache step saved a
      # directory nothing read. Setting it here makes the cache real and gives
      # the upload paths below a single source of truth for where the bundle
      # lands (see the arm64 job for why a literal path is wrong twice over).
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cargo-target-cache
    steps:
      - name: Preflight - updater signing key
        # A minisign key pasted without its "# comment" header line fails with
        # "Missing comment in secret key" at bundle time, after a ~30-minute
        # build. Check in seconds. NOTE: use `throw`, not `Write-Error` — the
        # default shell is PowerShell, where Write-Error is non-terminating
        # and would let the build continue past the failure.
        #
        # An empty-but-present secret is treated as absent (same trap as the
        # macOS jobs): `$env:TAURI_SIGNING_PRIVATE_KEY` is non-null when the
        # secret exists but is an empty string, so the null check alone would
        # miss it and the build would try to decode an empty key.
        shell: pwsh
        run: |
          $key = $env:TAURI_SIGNING_PRIVATE_KEY
          if ($null -eq $key -or -not ($key.Trim())) {
            Write-Host "No usable TAURI_SIGNING_PRIVATE_KEY (absent or empty): updater artifacts will not be signed."
            exit 0
          }
          $firstLine = ($key -split "`n")[0].Trim()
          if ($firstLine -notmatch '^#') {
            throw "TAURI_SIGNING_PRIVATE_KEY is missing its '#' comment header line. Paste the key in full, including the comment line at the top (tauri signer generate)."
          }
          Write-Host "Updater signing key looks valid."
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.90"
      - name: Install sccache
        run: choco install sccache -y
      - name: Cache sccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.sccache-cache
          key: sccache-windows-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            sccache-windows-
      - name: Cache cargo target
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cargo-target-cache
          key: cargo-target-windows-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-target-windows-
      - name: Install tauri-cli
        run: |
          if (-not (cargo tauri --version 2>$null | Select-String "2.9.3")) {
            cargo install tauri-cli --version "2.12.0" --locked
          }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install UI deps
        run: cd ui; npm ci
      - name: Build llama-server (CPU, static)
        # Windows has no Metal; build llama-server with the CPU backend and
        # static linking so the NSIS bundle carries a single self-contained
        # executable. The app calls it over 127.0.0.1 HTTP, so no TLS is needed.
        run: |
          git clone --filter=blob:none https://github.com/ggml-org/llama.cpp llama.cpp
          cd llama.cpp
          git checkout --detach f95b0d95394d5e311ba8228689972843178c5e28
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DLLAMA_CURL=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_APP=OFF
          cmake --build build --config Release --target llama-server
          # llama.cpp's server target lands in build\bin\Release (not build\Release).
          # cwd is <repo>/llama.cpp, so ..\ is the repo root.
          #
          # The destination must be the path tauri.conf.json actually maps
          # ("binaries/llama-server", no extension). Copying to
          # `llama-server.exe` put the real binary *next to* the mapped path,
          # so the bundle shipped the 74-byte placeholder committed there and
          # every Windows user who selected a local polish model got
          # "llama-server binary not found. Run scripts/build-llama-server.sh".
          New-Item -ItemType Directory -Path '..\crates\teletype-desktop\binaries' -Force | Out-Null
          $dest = '..\crates\teletype-desktop\binaries\llama-server.exe'
          Copy-Item build/bin/Release/llama-server.exe $dest
          # The resource map has no extension, so mirror the built binary onto
          # it as well. Keeping both means either mapping resolves.
          Copy-Item $dest '..\crates\teletype-desktop\binaries\llama-server'
          # The destination is no longer a committed placeholder (it is a build
          # artifact, see .gitignore and scripts/check-no-built-binaries.sh), so
          # this is checking the copy we just made rather than catching a
          # stale one. Keep it anyway: a short file here is a truncated or
          # wrong-architecture build, and shipping that is worse than failing.
          if ((Get-Item '..\crates\teletype-desktop\binaries\llama-server').Length -lt 1000000) {
            Write-Error "llama-server copy is under 1 MB; refusing to ship it"
            exit 1
          }
      - name: Build Tauri app (NSIS)
        # Produces the .exe, the .nsis.zip updater payload, and its signature.
        # An empty-but-present TAURI_SIGNING_PRIVATE_KEY is treated as absent
        # (same trap as the macOS jobs): clear it before the build so Tauri
        # takes its unsigned path instead of failing to decode an empty key.
        shell: pwsh
        run: |
          $key = $env:TAURI_SIGNING_PRIVATE_KEY
          if ($null -eq $key -or -not ($key.Trim())) {
            Write-Host "No usable TAURI_SIGNING_PRIVATE_KEY: clearing updater-signing env for an unsigned build."
            Remove-Item Env:TAURI_SIGNING_PRIVATE_KEY -ErrorAction SilentlyContinue
            Remove-Item Env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD -ErrorAction SilentlyContinue
          }
          cargo tauri build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            ${{ env.CARGO_TARGET_DIR }}/release/bundle/nsis/*.exe
            ${{ env.CARGO_TARGET_DIR }}/release/bundle/nsis/*.nsis.zip
            ${{ env.CARGO_TARGET_DIR }}/release/bundle/nsis/*.nsis.zip.sig
          if-no-files-found: error

  # Publishes everything to one release and writes the merged updater manifest.
  #
  # The manifest has to be built here, not in the build jobs, because it must
  # list both platforms: each job only knows about its own. A manifest missing
  # one platform means that platform's users can never be offered an update.
  publish:
    name: Publish release & updater manifest
    needs: [release-macos, release-macos-intel, release-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Assemble the updater manifest
        # Uses the endpoint from tauri.conf.json rather than repeating it here,
        # so the two cannot drift.
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          base="https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}"
          python3 - "$version" "$base" <<'PY'
          import datetime, glob, hashlib, json, os, sys

          version, base = sys.argv[1], sys.argv[2]
          platforms = {}

          # One entry per (payload, signature) pair actually present. A macOS
          # build can legitimately be universal or single-arch; list whatever
          # was built rather than assuming a key that may not exist, because a
          # manifest pointing at a missing key silently disables updates for
          # that platform.
          def entry(payload_glob, sig_glob, where, required=True):
              """One (payload, signature) pair, scoped to one artifact dir.

              Scoping matters now there are two macOS artifacts: both payloads
              are called Teletype.app.tar.gz, so an unscoped glob picks one at
              random and can attach the arm64 signature to the x86_64 download.

              `required=False` downgrades a missing signature to a warning and
              returns None. That is for the best-effort Intel job only: its
              `continue-on-error` means a partial artifact must not be able to
              stop the arm64 and Windows release from shipping. A missing
              signature on a *required* platform stays fatal, because the
              updater cannot verify that download.
              """
              payloads = sorted(glob.glob(f"{where}/**/{payload_glob}", recursive=True))
              if not payloads:
                  if required:
                      raise SystemExit(f"no {payload_glob} under {where}")
                  print(f"::warning::{where} has no {payload_glob}; skipping it.")
                  return None
              if len(payloads) > 1:
                  raise SystemExit(
                      f"{where} holds {len(payloads)} {payload_glob} payloads: "
                      f"{payloads}. Cannot choose one; refusing to guess."
                  )
              payload = payloads[0]
              sigs = sorted(glob.glob(f"{where}/**/{sig_glob}", recursive=True))
              if not sigs:
                  if required:
                      raise SystemExit(f"payload {payload} has no signature at {sig_glob}")
                  print(
                      f"::warning::{payload} has no signature; skipping this "
                      "platform rather than publishing an unverifiable download."
                  )
                  return None
              return {
                  "signature": os.path.basename(sigs[0]),
                  "url": f"{base}/{os.path.basename(payload)}",
                  "size": os.path.getsize(payload),
              }

          def arch_of(artifact):
              """The architecture the build job recorded for its own binary.

              Read from a marker file written by the job that compiled the
              binary, not from a filename or a guess. Without it, a
              `darwin-x86_64` entry can point at an arm64 payload: the signature
              is a genuine signature over the arm64 tarball, so it verifies, the
              app installs, and then refuses to launch on the Intel Mac that
              asked for it. An Intel Mac with no entry at all just never gets an
              update, which is a much smaller failure.
              """
              marker = sorted(glob.glob(f"dist/{artifact}/**/ARCH", recursive=True))
              if not marker:
                  return None
              with open(marker[0]) as fh:
                  return fh.read().strip()

          if not os.path.isdir("dist/macos-release"):
              raise SystemExit("the arm64 macOS artifact is missing from dist/")

          mac_arch = arch_of("macos-release")
          if mac_arch != "aarch64":
              raise SystemExit(
                  f"macos-release reports arch {mac_arch!r}, expected 'aarch64'. "
                  "Refusing to publish a manifest that could point at the wrong "
                  "binary."
              )
          mac = entry("*.app.tar.gz", "*.app.tar.gz.sig", "dist/macos-release", required=False)
          if mac:
              platforms["darwin-aarch64"] = mac
          else:
              print("::notice::arm64 macOS payload present but unsigned; "
                    "darwin-aarch64 not advertised in the updater manifest this "
                    "release. The .app/.dmg assets still ship; in-app updates "
                    "for this platform are unavailable until a signing key is "
                    "added.")

          # Intel is optional: the job is `continue-on-error`, so on a day when
          # the x86_64 build breaks, this branch is simply skipped and arm64 and
          # Windows users are unaffected.
          if os.path.isdir("dist/macos-release-intel"):
              intel_arch = arch_of("macos-release-intel")
              if intel_arch != "x86_64":
                  raise SystemExit(
                      f"macos-release-intel reports arch {intel_arch!r}, expected "
                      "'x86_64'. Refusing to advertise it under darwin-x86_64."
                  )
              intel = entry(
                  "*.app.tar.gz", "*.app.tar.gz.sig", "dist/macos-release-intel",
                  required=False,
              )
              if intel:
                  platforms["darwin-x86_64"] = intel
                  print("advertising darwin-x86_64 from the Intel build")
              else:
                  print("::notice::Intel artifact present but unusable/unsigned; "
                        "darwin-x86_64 not advertised this release.")
          else:
              print("::warning::No Intel macOS artifact. Intel Macs will not be "
                    "offered an update this release.")

          win = entry("*.nsis.zip", "*.nsis.zip.sig", "dist/windows-release", required=False)
          if win:
              platforms["windows-x86_64"] = win
          else:
              print("::notice::Windows payload present but unsigned; "
                    "windows-x86_64 not advertised in the updater manifest this "
                    "release. The .exe asset still ships; in-app updates for "
                    "this platform are unavailable until a signing key is added.")

          if not platforms:
              print("::warning::No signed updater payloads found under dist/. "
                    "Publishing the release with no updater manifest entries: "
                    "the .app/.dmg/.exe assets still ship, but in-app updates "
                    "are disabled for every platform until a signing key is "
                    "added. Writing an empty-platforms manifest so the "
                    "updater never offers a broken download.")

          manifest = {
              "version": version,
              "notes": f"v{version}",
              # The updater plugin (tauri-plugin-updater 2.x) treats a missing
              # or empty pub_date as "no update available" and never offers the
              # download, so this field is load-bearing. The tauri signer
              # stamps it with the build time; here the tag push time is the
              # honest equivalent.
              "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime(
                  "%Y-%m-%dT%H:%M:%SZ"
              ),
              "platforms": platforms,
          }
          with open("latest.json", "w") as fh:
              json.dump(manifest, fh, indent=2)
          print(json.dumps(manifest, indent=2))
          PY
      - name: Check release asset names are unique
        # A duplicate name means one architecture silently does not ship, and
        # the manifest would advertise a download that resolves to the other
        # one. Cheap to check, and the failure mode is otherwise invisible.
        run: |
          set -euo pipefail
          find dist -type f \( -name '*.app' -o -name '*.dmg' -o -name '*.exe' \
            -o -name '*.app.tar.gz' -o -name '*.app.tar.gz.sig' \
            -o -name '*.nsis.zip' -o -name '*.nsis.zip.sig' \) \
            -exec basename {} \; | sort | uniq -d | while read -r dup; do
            echo "::error::two release assets are both named '$dup'"
            find dist -name "$dup" -exec sh -c 'echo "    {}"' \;
            exit 1
          done
          echo "asset names are unique"
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          make_latest: true
          files: |
            dist/**/*.app
            dist/**/*.dmg
            dist/**/*.exe
            dist/**/*.app.tar.gz
            dist/**/*.app.tar.gz.sig
            dist/**/*.nsis.zip
            dist/**/*.nsis.zip.sig
            latest.json
